ument.createElement('section');d.className='q';d.innerHTML='<b>['+x.lesson+']</b><h3>'+(i+1)+'. '+x.question+'</h3>'+x.options.map((o,k)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+k+'"> '+String.fromCharCode(65+k)+'. '+o+'</label>').join('');quiz.appendChild(d)});progress.textContent='200題庫隨機抽50題';submitBtn.disabled=false;done=false;result.innerHTML=''}startBtn.onclick=()=>{name=studentName.value.trim();if(!name){msg.textContent='請輸入姓名';return}localStorage.setItem('currentStudentName',name);studentName.disabled=startBtn.disabled=true;msg.textContent='作答者：'+name;started=true;render()};submitBtn.onclick=()=>{if(!started||done)return;let n=0,wrong=[];bank.forEach((x,i)=>{const s=document.querySelector('input[name=q'+i+']:checked'),a=s?+s.value:null;if(a===x.answer)n++;else wrong.push({lesson:x.lesson,question:x.question,userAnswer:a===null?'未作答':x.options[a],correct:x.options[x.answer],explanation:x.explanation,key:x.key,trap:x.trap,date:new Date().toLocaleString('zh-TW')})});result.innerHTML='<div class="box ok"><h2>成績 '+Math.round(n*2)+' 分，答對 '+n+'/50</h2></div>'+wrong.map(x=>'<div class="wrong"><b>'+x.question+'</b><p>你的答案：'+x.userAnswer+'</p><p>正確答案：'+x.correct+'</p><p>解析：'+x.explanation+'</p></div>').join('');let w=[];try{w=JSON.parse(localStorage.getItem('wrongbook')||'[]')}catch(e){}wrong.forEach(x=>{const i=w.findIndex(y=>y.lesson===x.lesson&&y.question===x.question);i>=0?w[i]=x:w.push(x)});localStorage.setItem('wrongbook',JSON.stringify(w));done=true;submitBtn.disabled=true};retryBtn.onclick=()=>{if(started&&window.confirm('確定重新抽取50題？'))render()};studentName.value=localStorage.getItem('currentStudentName')||'';</script></body></html>
