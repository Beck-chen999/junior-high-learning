estion":"「小明是班長」屬於哪一種句型？","options":["敘事句","表態句","有無句","判斷句"],"answer":3,"explanation":"用「是」判定主語身分。 正確答案是「判斷句」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":35,"lesson":"語文常識二 句型","question":"「窗外有一棵樹」屬於哪一種句型？","options":["敘事句","表態句","有無句","判斷句"],"answer":2,"explanation":"以「有」表示存在。 正確答案是「有無句」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":36,"lesson":"語文常識二 句型","question":"「天空很藍」屬於哪一種句型？","options":["有無句","表態句","判斷句","敘事句"],"answer":1,"explanation":"說明主語的性質或狀態。 正確答案是「表態句」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":37,"lesson":"語文常識二 句型","question":"「老師微笑點頭」屬於哪一種句型？","options":["敘事句","判斷句","表態句","有無句"],"answer":0,"explanation":"描述老師的動作。 正確答案是「敘事句」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":38,"lesson":"語文常識二 句型","question":"「此地無銀三百兩」屬於哪一種句型？","options":["表態句","判斷句","敘事句","有無句"],"answer":3,"explanation":"以「無」表示不存在。 正確答案是「有無句」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":39,"lesson":"語文常識二 句型","question":"判斷句常見的判斷詞為何？","options":["很、非常","跑、跳","是、為、乃、即","有、無"],"answer":2,"explanation":"這些詞常用於判定身分或關係。 正確答案是「是、為、乃、即」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":40,"lesson":"語文常識二 句型","question":"表態句的核心功能是什麼？","options":["判定身分","說明主語的性質或狀態","表示事物存在","敘述動作經過"],"answer":1,"explanation":"例如「花很美」。 正確答案是「說明主語的性質或狀態」。","key":"先找述語核心：動作為敘事，性質狀態為表態，身分判定為判斷，存在與否為有無。","trap":"不要只看到「是、有、很」就機械判斷，仍要確認全句功能。"},{"id":41,"lesson":"綜合語文","question":"「香遠益清／相得益彰」中的「益」意義如何？","options":["相同，都是更加","不同，前者利益","不同，後者增加","相同，都是好處"],"answer":0,"explanation":"兩者皆為更加。 正確答案是「相同，都是更加」。","key":"先圈出題幹限制詞，再以課文主旨或文本證據逐一排除。","trap":"避免只因選項出現熟悉詞語就作答，也不要加入原文沒有的推論。"},{"id":42,"lesson":"綜合語文","question":"下列哪一個成語表示事情條件成熟後自然成功？","options":["杯水車薪","奇貨可居","唯唯諾諾","水到渠成"],"answer":3,"explanation":"水流到便成渠，比喻自然成功。 正確答案是「水到渠成」。","key":"先圈出題幹限制詞， answer])+'</b></p><div class="analysis-box"><p><b>解析：</b>'+esc(x.explanation)+'</p><p><b>解題關鍵：</b>'+esc(x.key)+'</p><p><b>易錯提醒：</b>'+esc(x.trap)+'</p></div></div>'});result.innerHTML=out;localStorage.setItem('chinese_exam2_score',String(pct));let hist=[];try{hist=JSON.parse(localStorage.getItem('scoreHistory')||'[]')}catch(e){}hist.push({studentName:name,source:'第二次段考50題模擬考',date:new Date().toLocaleString('zh-TW'),score:pct,correct:n,total:50,unanswered:u});localStorage.setItem('scoreHistory',JSON.stringify(hist));let wb=[];try{wb=JSON.parse(localStorage.getItem('wrongbook')||'[]')}catch(e){}wrong.forEach(x=>{let j=wb.findIndex(y=>y.lesson===x.lesson&&y.question===x.question);if(j>=0)wb[j]=x;else wb.push(x)});localStorage.setItem('wrongbook',JSON.stringify(wb));done=true;submitBtn.disabled=true;result.scrollIntoView({behavior:'smooth'})};retryBtn.onclick=()=>{if(!started)return alert('請先確認姓名');if(window.confirm('確定清除目前答案並重新開始？'))render()};studentName.value=localStorage.getItem('currentStudentName')||'';</script></body></html>
