<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>第一次段考模擬考 V3</title>

<style>

body{
font-family:"Microsoft JhengHei",sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#1565c0;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.question{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

button{
background:#1565c0;
color:white;
padding:12px 30px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:18px;
}

button:hover{
background:#0d47a1;
}

.result-card{

background:white;

padding:20px;

margin-top:20px;

border-radius:10px;

box-shadow:0 2px 5px rgba(0,0,0,.1);

}

.analysis{

background:#fff3f3;

padding:15px;

margin-top:15px;

border-left:5px solid red;

border-radius:8px;

}

.good{

background:#e8f5e9;

padding:15px;

border-radius:8px;

}

.warning{

background:#fff3cd;

padding:15px;

border-radius:8px;

}

</style>

</head>

<body>

<header>

<h1>📝 第一次段考模擬考</h1>

<p>翰林國文八上 V3</p>

</header>

<div class="container">

<div id="quiz">

<div class="warning">

題庫載入中...

</div>

</div>

<br>

<button onclick="checkAnswer()">

提交答案

</button>

<div id="result"></div>

</div>

<script src="questions.js"></script>

<script>

let examQuestions = [];

// =================================
// 洗牌
// =================================

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

// =================================
// 載入題目
// =================================

function loadQuiz(){

const quizDiv =
document.getElementById("quiz");

if(
typeof window.questionBank==="undefined"
){

quizDiv.innerHTML=

`
<div class="warning">

⚠️ 找不到 questions.js

</div>
`;

return;

}

if(window.questionBank.length===0){

quizDiv.innerHTML=

`
<div class="warning">

⚠️ 題庫為空

</div>
`;

return;

}

const QUESTION_COUNT =

Math.min(
50,
window.questionBank.length
);

examQuestions =

shuffle(
[...questionBank]
)
.slice(0,QUESTION_COUNT);

quizDiv.innerHTML="";

examQuestions.forEach((q,index)=>{

let html =

`
<div class="question">

<h3>

${index+1}. ${q.question}

</h3>
`;

q.options.forEach((option,i)=>{

html +=

`
<label>

<input
type="radio"
name="q${index}"
value="${i}"
>

${option}

</label>

<br><br>
`;

});

html += "</div>";

quizDiv.innerHTML += html;

});

}

// =================================
// 批改
// =================================

function checkAnswer(){

let score = 0;

let wrongQuestions = [];

examQuestions.forEach((q,index)=>{

const selected =

document.querySelector(
`input[name="q${index}"]:checked`
);

if(
selected &&
Number(selected.value)===q.answer
){

score++;

}else{

wrongQuestions.push({

lesson:
q.lesson || "未分類",

question:
q.question,

correct:
q.options[q.answer],

explanation:
q.explanation || "請複習課程內容"

});

}

});

const percent =

Math.round(
score/examQuestions.length*100
);

let resultHtml=

`
<div class="result-card">

<div class="good">

<h2>

🎯 得分

${score}

/

${examQuestions.length}

</h2>

<h2>

📊 成績

${percent} 分

</h2>

</div>
`;

if(wrongQuestions.length>0){

resultHtml +=

`
<h2>

❌ 錯題解析

</h2>
`;

wrongQuestions.forEach((item,index)=>{

resultHtml +=

`
<div class="analysis">

<b>

第 ${index+1} 題

</b>

<br><br>

${item.question}

<br><br>

✅ 正確答案：

${item.correct}

<br><br>

📖 解析：

${item.explanation}

</div>
`;

});

}else{

resultHtml +=

`
<div class="good">

🎉 全部答對！

</div>
`;

}

resultHtml += "</div>";

document
.getElementById("result")
.innerHTML=resultHtml;

// 儲存錯題本

localStorage.setItem(

"wrongbook",

JSON.stringify(wrongQuestions)

);

// 歷史成績

let historyScores =

JSON.parse(
localStorage.getItem("scoreHistory")
) || [];

historyScores.push({

date:new Date()
.toLocaleString(),

score:percent,

correct:score,

total:examQuestions.length

});

localStorage.setItem(

"scoreHistory",

JSON.stringify(historyScores)

);

// 最新成績

localStorage.setItem(

"chinese_exam1_score",

percent

);

}

// =================================
// 頁面完成再載入
// =================================

window.onload = function(){

loadQuiz();

};

</script>

</body>
</html>
