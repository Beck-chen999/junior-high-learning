<script src="questions.js"></script>

<script>

// ======================
// 如果 questions.js 未載入
// 使用本地題庫
// ======================

if(typeof questionBank === "undefined"){

const questionBank = [];

}

// ======================
// 洗牌
// ======================

function shuffle(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

// ======================
// 抽題
// ======================

const QUESTION_COUNT =
Math.min(50,questionBank.length);

const examQuestions =
shuffle([...questionBank])
.slice(0,QUESTION_COUNT);


// ======================
// 顯示題目
// ======================

const quizDiv =
document.getElementById("quiz");

examQuestions.forEach((q,index)=>{

let html =

`
<div class="question">

<h3>

${index+1}. ${q.question}

</h3>
`;

q.options.forEach((option,i)=>{

html +=

`
<label>

<input
type="radio"
name="q${index}"
value="${i}"
>

${option}

</label>

<br><br>
`;

});

html += "</div>";

quizDiv.innerHTML += html;

});


// ======================
// 批改
// ======================

function checkAnswer(){

let score = 0;

let wrongQuestions = [];

examQuestions.forEach((q,index)=>{

let selected =
document.querySelector(
`input[name="q${index}"]:checked`
);

if(
selected &&
Number(selected.value) === q.answer
){

score++;

}else{

wrongQuestions.push({

question:q.question,

correct:
q.options[q.answer],

explanation:
q.explanation || "請複習本單元重點"

});

}

});


// ======================
// 計算分數
// ======================

let percent = Math.round(

score /
examQuestions.length
*100

);


// ======================
// 顯示結果
// ======================

let resultHtml =

`
<h2>

🎯 得分

${score}

/

${examQuestions.length}

</h2>

<h2>

📊 成績

${percent} 分

</h2>
`;


// ======================
// 顯示錯題
// ======================

if(wrongQuestions.length>0){

resultHtml +=

`
<hr>

<h2>

❌ 錯題解析

</h2>
`;

wrongQuestions.forEach((item,index)=>{

resultHtml +=

`
<div style="text-align:left;
margin-bottom:20px;
padding:15px;
background:#fff3f3;
border-radius:8px;">

<b>
第 ${index+1} 題
</b>

<br><br>

${item.question}

<br><br>

✅ 正確答案：

${item.correct}

<br><br>

📖 解析：

${item.explanation}

</div>
`;

});

}else{

resultHtml +=

`
<hr>

<h2>

🎉 全部答對！

</h2>
`;

}

document.getElementById("result")
.innerHTML = resultHtml;


// ======================
// 儲存最新成績
// ======================

localStorage.setItem(
"chinese_exam1_score",
percent
);


// ======================
// 儲存歷史成績
// ======================

let historyScores =

JSON.parse(
localStorage.getItem("scoreHistory")
) || [];

historyScores.push({

date:new Date()
.toLocaleString(),

score:percent

});

localStorage.setItem(

"scoreHistory",

JSON.stringify(historyScores)

);


// ======================
// 儲存錯題本
// ======================

localStorage.setItem(

"wrongbook",

JSON.stringify(wrongQuestions)

);

}

</script>
