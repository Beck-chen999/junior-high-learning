<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>第一次段考模擬考</title>

<style>

body{
font-family:"Microsoft JhengHei";
background:#f5f5f5;
margin:0;
}

header{
background:#1976d2;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.question{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 4px rgba(0,0,0,.1);
}

button{
background:#1976d2;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#125ea8;
}

#result{
margin-top:20px;
font-size:24px;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>📝 第一次段考模擬考</h1>

<p>翰林國文八上</p>

</header>

<div class="container">

<div id="quiz"></div>

<button onclick="checkAnswer()">
提交答案
</button>

<div id="result"></div>

</div>

<script>

// 題庫

const questionBank = [

{
question:"田園之秋選中，大自然被比喻成什麼？",
options:["電影","戲劇","小說","童話"],
answer:1
},

{
question:"田園之秋選中，大西北雨的順序為何？",
options:[
"烏雲→雷電→大雨→天晴",
"大雨→雷電→烏雲→天晴",
"雷電→大雨→天晴→烏雲",
"天晴→烏雲→雷電→大雨"
],
answer:0
},

{
question:"「纖纖擢素手」中的擢是什麼意思？",
options:["觀看","奔跑","舉起","放下"],
answer:2
},

{
question:"古詩十九首屬於哪類詩？",
options:["五言古詩","七言律詩","詞","曲"],
answer:0
},

{
question:"下雨天，真好的作者是誰？",
options:["琦君","余光中","張曉風","席慕蓉"],
answer:0
},

{
question:"下雨天，真好一文主要表達什麼？",
options:["戰爭","思鄉與童年回憶","科學知識","歷史故事"],
answer:1
},

{
question:"下列何者屬於聯綿詞？",
options:["老師","葡萄","教室","學生"],
answer:1
},

{
question:"「美麗」屬於哪種詞類？",
options:["名詞","動詞","形容詞","副詞"],
answer:2
},

{
question:"「非常」屬於哪種詞類？",
options:["副詞","名詞","動詞","代名詞"],
answer:0
},

{
question:"田園之秋選最常出現的修辭之一？",
options:["借代","映襯","摹寫","引用"],
answer:2
}

];

// 打亂題目

function shuffle(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]
=
[array[j],array[i]];

}

return array;

}

// 抽題

const examQuestions =
shuffle([...questionBank]).slice(0,5);

// 顯示題目

const quizDiv =
document.getElementById("quiz");

examQuestions.forEach((q,index)=>{

let html=`

<div class="question">

<h3>

${index+1}. ${q.question}

</h3>

`;

q.options.forEach((option,i)=>{

html += `

<label>

<input
type="radio"
name="q${index}"
value="${i}">

${option}

</label>

<br><br>

`;

});

html += "</div>";

quizDiv.innerHTML += html;

});

// 批改

function checkAnswer(){

let score=0;

examQuestions.forEach((q,index)=>{

let selected = document.querySelector(

`input[name="q${index}"]:checked`

);

if(
selected &&
Number(selected.value)===q.answer
){
score++;
}

});

let percent =
Math.round(
score/examQuestions.length*100
);

document.getElementById("result").innerHTML =
"🎯 得分：" +
score +
" / " +
examQuestions.length +
"<br><br>📊 成績：" +
percent +
" 分";
`;

localStorage.setItem(
"chinese_exam1_score",
percent
);

}

</script>

</body>

</html>
