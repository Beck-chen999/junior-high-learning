只因選項出現熟悉詞語就作答，也不要加入原文沒有的推論。"}];let name='',started=false,done=false;function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(){quiz.innerHTML='';bank.forEach((x,i)=>{let d=document.createElement('section');d.className='question';d.id='qcard'+i;d.innerHTML='<span class="tag">'+esc(x.lesson)+'</span><h3>'+(i+1)+'. '+esc(x.question)+'</h3>';x.options.forEach((o,k)=>{let l=document.createElement('label');l.className='option';l.innerHTML='<input type="radio" name="q'+i+'" value="'+k+'"><span>'+String.fromCharCode(65+k)+'. '+esc(o)+'</span>';d.appendChild(l)});quiz.appendChild(d)});progress.textContent='本次共50題';submitBtn.disabled=false;done=false;result.innerHTML=''}startBtn.onclick=()=>{name=studentName.value.trim();if(!name){msg.textContent='⚠️ 請輸入姓名';return}localStorage.setItem('currentStudentName',name);studentName.disabled=true;startBtn.disabled=true;msg.textContent='✅ 作答者：'+name;started=true;render()};submitBtn.onclick=()=>{if(done||!started)return;let n=0,u=0,wrong=[];bank.forEach((x,i)=>{let s=document.querySelector('input[name=q'+i+']:checked'),a=s?+s.value:null,card=document.getElementById('qcard'+i);card.classList.remove('unanswered');if(a===null){u++;card.classList.add('unanswered')}if(a===x.answer)n++;else wrong.push({id:x.id,lesson:x.lesson,question:x.question,userAnswer:a===null?'未作答':x.options[a],correct:x.options[x.answer],explanation:x.explanation,key:x.key,trap:x.trap,date:new Date().toLocaleString('zh-TW')})});let pct=Math.round(n/50*100),out='<div class="card good"><h2>🎯 '+n+'/50，成績 '+pct+' 分</h2><p>作答者：'+esc(name)+'｜未作答：'+u+'題</p></div>';out+='<div class="analysis-title"><h2>📘 50題完整解析</h2><p>以下依題號逐題說明，答對題也可以再次確認判斷依據。</p></div>';bank.forEach((x,i)=>{let s=document.querySelector('input[name=q'+i+']:checked'),a=s?+s.value:null,ok=a===x.answer;out+='<div class="'+(ok?'correct-review':'wrong')+'"><b>第'+(i+1)+'題 ['+esc(x.lesson)+'] '+(ok?'✅答對':'❌需訂正')+'</b><p>'+esc(x.question)+'</p><p>你的答案：'+(a===null?'未作答':esc(x.options[a]))+'</p><p><b>正確答案：'+esc(x.options[x.answer])+'</b></p><div class="analysis-box"><p><b>解析：</b>'+esc(x.explanation)+'</p><p><b>解題關鍵：</b>'+esc(x.key)+'</p><p><b>易錯提醒：</b>'+esc(x.trap)+'</p></div></div>'});result.innerHTML=out;localStorage.setItem('chinese_exam3_score',String(pct));let hist=[];try{hist=JSON.parse(localStorage.getItem('scoreHistory')||'[]')}catch(e){}hist.push({studentName:name,source:'第三次段考50題模擬考',date:new Date().toLocaleString('zh-TW'),score:pct,correct:n,total:50,unanswered:u});localStorage.setItem('scoreHistory',JSON.stringify(hist));let wb=[];try{wb=JSON.parse(localStorage.getItem('wrongbook')||'[]')}catch(e){}wrong.forEach(x=>{let j=wb.findIndex(y=>y.lesson===x.lesson&&y.question===x.question);if(j>=0)wb[j]=x;else wb.push(x)});localStorage.setItem('wrongbook',JSON.stringify(wb));done=true;submitBtn.disabled=true;result.scrollIntoView({behavior:'smooth'})};retryBtn.onclick=()=>{if(!started)return alert('請先確認姓名');if(window.confirm('確定清除目前答案並重新開始？'))render()};studentName.value=localStorage.getItem('currentStudentName')||'';</script></body></html>
