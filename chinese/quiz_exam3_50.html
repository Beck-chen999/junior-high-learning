'use strict';const bank=[{"id": 1, "lesson": "第7課 張釋之執法", "question": "「法者，天子所與天下公共也」的核心理念為何？", "options": ["法律是君王與百姓共同遵守的準則", "君王可任意加刑", "法律只約束百姓", "廷尉可自行改法"], "answer": 0, "explanation": "法律標準必須一致。"}, {"id": 2, "lesson": "第7課 張釋之執法", "question": "「今法如此而更重之，是法不信於民也」最接近何種理念？", "options": ["嚴刑峻法", "屈法伸情", "罪疑唯重", "法貴有常"], "answer": 3, "explanation": "執法標準不能任意浮動。"}, {"id": 3, "lesson": "第7課 張釋之執法", "question": "張釋之最主要的人物特質為何？", "options": ["急躁易怒", "優柔寡斷", "剛正不阿、依法論理", "逢迎權貴"], "answer": 2, "explanation": "面對皇帝仍堅守法理。"}, {"id": 4, "lesson": "第7課 張釋之執法", "question": "漢文帝最後接受判決，顯示何種特質？", "options": ["徇私枉法", "從善如流", "剛愎自用", "怙惡不悛"], "answer": 1, "explanation": "文帝能接受合理勸諫。"}, {"id": 5, "lesson": "第7課 張釋之執法", "question": "「民安所錯其手足」的「錯」通何字？", "options": ["措", "挫", "厝", "銼"], "answer": 0, "explanation": "錯通措，意為安放。"}, {"id": 6, "lesson": "第7課 張釋之執法", "question": "「屬之廷尉」的「屬」讀音與意思為何？", "options": ["ㄕㄨˇ，隸屬", "ㄓㄨˇ，囑咐", "ㄕㄨˇ，計算", "ㄓㄨˇ，交付"], "answer": 3, "explanation": "此處為交付案件。"}, {"id": 7, "lesson": "第7課 張釋之執法", "question": "《史記》屬於何種史書？", "options": ["國別體", "志人小說", "紀傳體通史", "編年體斷代史"], "answer": 2, "explanation": "《史記》是第一部紀傳體通史。"}, {"id": 8, "lesson": "第7課 張釋之執法", "question": "下列何者不是《史記》五體？", "options": ["列傳", "志", "本紀", "表"], "answer": 1, "explanation": "五體為本紀、表、書、世家、列傳。"}, {"id": 9, "lesson": "第7課 張釋之執法", "question": "「廷尉，天下之平也」中的「平」意指什麼？", "options": ["公平的準則", "平安", "平民", "地勢平坦"], "answer": 0, "explanation": "廷尉象徵司法公平。"}, {"id": 10, "lesson": "第7課 張釋之執法", "question": "韓非子「法不阿貴」與課文哪一句最呼應？", "options": ["令他馬，固不敗傷我乎", "上使立誅之則已", "久之，文帝曰", "法者，天子所與天下公共也"], "answer": 3, "explanation": "都強調法律不因身分而偏私。"}, {"id": 11, "lesson": "第8課 找尋失落的水源", "question": "「夠用就好」最接近哪一句？", "options": ["多多益善", "貨暢其流", "鼴鼠飲河，不過滿腹", "竭澤而漁，焚林而畋"], "answer": 2, "explanation": "人的需求有限，不必過度索取。"}, {"id": 12, "lesson": "第8課 找尋失落的水源", "question": "「自然從未啞過」主要表達什麼？", "options": ["語言完全失傳", "人類逐漸失去傾聽自然的能力", "自然沒有聲音", "神靈拒絕人類"], "answer": 1, "explanation": "問題在人類遠離自然。"}, {"id": 13, "lesson": "第8課 找尋失落的水源", "question": "父親強調「付出」的用意為何？", "options": ["親身勞動才能理解受益與自然連結", "賣水利潤較低", "禁止所有交易", "山林工作必有報酬"], "answer": 0, "explanation": "付出使人理解自然贈禮。"}, {"id": 14, "lesson": "第8課 找尋失落的水源", "question": "成為「山的家人」需要什麼？", "options": ["購買土地", "熟背路標", "拒絕科技", "理解並尊重環境"], "answer": 3, "explanation": "歸屬來自理解與尊重。"}, {"id": 15, "lesson": "第8課 找尋失落的水源", "question": "本文的自然觀最接近何者？", "options": ["全面禁止取用", "科技必然有害", "人與自然互惠共存、取用有度", "自然只供人使用"], "answer": 2, "explanation": "核心是節制、共享、尊重。"}, {"id": 16, "lesson": "第8課 找尋失落的水源", "question": "「自然從未啞過」主要運用何種修辭？", "options": ["借代", "擬人", "頂真", "回文"], "answer": 1, "explanation": "賦予自然發聲與溝通能力。"}, {"id": 17, "lesson": "第8課 找尋失落的水源", "question": "作者提議賣水，父親回應的安排有何作用？", "options": ["呈現經濟觀點與土地倫理的差異", "只交代水價", "製造恐怖氣氛", "介紹商業流程"], "answer": 0, "explanation": "對話深化主題。"}, {"id": 18, "lesson": "第8課 找尋失落的水源", "question": "下列何者違反「夠用就好」？", "options": ["只取當日所需", "尊重採集季節", "保留資源給後代", "為獲利大量採集稀有植物"], "answer": 3, "explanation": "過度採集破壞平衡。"}, {"id": 19, "lesson": "第9課 一棵開花的樹", "question": "開花的樹主要象徵什麼？", "options": ["佛祖", "旁觀者", "為愛等待的抒情主角", "心儀對象"], "answer": 2, "explanation": "花樹是「我」的具體化身。"}, {"id": 20, "lesson": "第9課 一棵開花的樹", "question": "全詩最關鍵的轉折為何？", "options": ["長在路旁", "對方無視地走過", "向佛祈求", "花朵盛開"], "answer": 1, "explanation": "由期盼轉為失落。"}, {"id": 21, "lesson": "第9課 一棵開花的樹", "question": "顫抖的葉象徵什麼？", "options": ["期待中帶有緊張不安", "憤怒報復", "冷漠平靜", "天氣寒冷"], "answer": 0, "explanation": "表現相遇前的複雜心情。"}, {"id": 22, "lesson": "第9課 一棵開花的樹", "question": "落花與凋零的心象徵什麼？", "options": ["春天來臨", "感情圓滿", "事業成功", "期待破滅與情感失落"], "answer": 3, "explanation": "花落象徵希望落空。"}, {"id": 23, "lesson": "第9課 一棵開花的樹", "question": "漫長祈求主要運用何種修辭？", "options": ["頂真", "回文", "誇飾", "借代"], "answer": 2, "explanation": "放大時間以凸顯執著。"}, {"id": 24, "lesson": "第9課 一棵開花的樹", "question": "「朋友啊」主要運用何種修辭？", "options": ["映襯", "呼告", "設問", "借代"], "answer": 1, "explanation": "直接呼喚傾訴對象。"}, {"id": 25, "lesson": "第9課 一棵開花的樹", "question": "詩末意境最接近何者？", "options": ["落花有意，流水無情", "兩情若是久長時", "海內存知己", "柳暗花明又一村"], "answer": 0, "explanation": "表現單向情感未獲回應。"}, {"id": 26, "lesson": "第9課 一棵開花的樹", "question": "〈暮歌〉的「將暮未暮」象徵什麼？", "options": ["純粹恐懼", "拒絕老去", "日出希望", "既有餘溫又有沉靜美的過渡時刻"], "answer": 3, "explanation": "是光暗之間的過渡。"}, {"id": 27, "lesson": "第10課 畫的哀傷", "question": "〈畫的哀傷〉採何種敘述角度？", "options": ["第三人稱全知", "第二人稱", "岡本第一人稱追憶", "志村第一人稱"], "answer": 2, "explanation": "成年岡本回憶少年往事。"}, {"id": 28, "lesson": "第10課 畫的哀傷", "question": "岡本為作品展畫了什麼？", "options": ["自己的肖像", "巨大馬頭", "哥倫布", "水車"], "answer": 1, "explanation": "岡本觀察馬廄並畫馬頭。"}, {"id": 29, "lesson": "第10課 畫的哀傷", "question": "兩人關係改變的關鍵事件為何？", "options": ["共同寫生", "共同考試", "校長訓話", "一起搬家"], "answer": 0, "explanation": "寫生讓岡本開始欣賞志村。"}, {"id": 30, "lesson": "第10課 畫的哀傷", "question": "岡本態度轉變的正確順序為何？", "options": ["欣賞→嫉妒→冷漠→忿恨", "冷漠→崇拜→厭惡→遺忘", "懷念→競爭→冷漠→欣賞", "嫉妒→忿恨→欣賞→懷念"], "answer": 3, "explanation": "由競爭走向理解與懷念。"}, {"id": 31, "lesson": "第10課 畫的哀傷", "question": "志村的主要人物特質為何？", "options": ["膽小退縮", "好勝嫉妒", "溫和謙遜、專注創作", "粗暴傲慢"], "answer": 2, "explanation": "志村與岡本形成對比。"}, {"id": 32, "lesson": "第10課 畫的哀傷", "question": "「黑暗中也有歡欣，光明裡也有哀傷」意指什麼？", "options": ["藝術使人永生", "人生苦樂交織", "黑暗才值得珍惜", "樂觀消除悲傷"], "answer": 1, "explanation": "順逆境都可能有複雜感受。"}, {"id": 33, "lesson": "第10課 畫的哀傷", "question": "文末明亮景色的主要作用為何？", "options": ["反襯摯友已逝與人事已非", "讚美旅遊景點", "證明畫技進步", "交代天氣"], "answer": 0, "explanation": "明景反襯哀傷。"}, {"id": 34, "lesson": "自學選文 世說新語選", "question": "《世說新語》屬於何種作品？", "options": ["志怪章回小說", "紀傳體史書", "詩歌總集", "志人筆記小說"], "answer": 3, "explanation": "主要記錄名士言行軼事。"}, {"id": 35, "lesson": "自學選文 世說新語選", "question": "《世說新語》的編撰者為誰？", "options": ["班固", "司馬光", "南朝宋劉義慶", "司馬遷"], "answer": 2, "explanation": "劉義慶召集文人編撰。"}, {"id": 36, "lesson": "自學選文 世說新語選", "question": "郗太傅欣賞王羲之何種特質？", "options": ["廉潔執法", "率真自然、從容自若", "拘謹矜持", "急躁易怒"], "answer": 1, "explanation": "坦腹東床表現自然不做作。"}, {"id": 37, "lesson": "自學選文 世說新語選", "question": "「東床快婿」通常指什麼？", "options": ["令人滿意的女婿", "優秀學生", "公平官員", "親密朋友"], "answer": 0, "explanation": "典故來自王羲之坦腹東床。"}, {"id": 38, "lesson": "自學選文 世說新語選", "question": "王藍田食雞子最突出何種描寫？", "options": ["景物描寫", "心理獨白", "外貌描寫", "連續動作描寫"], "answer": 3, "explanation": "刺、擲、蹍、齧、吐凸顯性急。"}, {"id": 39, "lesson": "自學選文 世說新語選", "question": "「筯」通哪一字？", "options": ["注", "住", "箸", "著"], "answer": 2, "explanation": "筯通箸，指筷子。"}, {"id": 40, "lesson": "自學選文 世說新語選", "question": "「取內口中」的「內」如何解釋？", "options": ["接納意見", "同納，放入", "裡面", "內心"], "answer": 1, "explanation": "內讀ㄋㄚˋ，同納。"}, {"id": 41, "lesson": "自學選文 世說新語選", "question": "王右軍評論王藍田帶有何種語氣？", "options": ["嘲諷其性情忿狷", "讚美豪爽", "佩服勇敢", "同情不幸"], "answer": 0, "explanation": "結語點出王藍田急躁無可取。"}, {"id": 42, "lesson": "跨課統整", "question": "哪一組都主要運用對比？", "options": ["張釋之與法律／水源與路標", "花樹與佛／馬頭與畫紙", "司馬遷與席慕蓉／父親與山林", "諸郎與王羲之／岡本與志村"], "answer": 3, "explanation": "兩組均以差異凸顯人物。"}, {"id": 43, "lesson": "跨課統整", "question": "哪一組都呈現態度或觀點轉變？", "options": ["王羲之與張釋之", "席慕蓉與司馬遷", "漢文帝與岡本", "王藍田與志村"], "answer": 2, "explanation": "文帝由怒到接受；岡本由嫉妒到欣賞。"}, {"id": 44, "lesson": "跨課統整", "question": "第7課與第8課共同強調什麼？", "options": ["權力決定一切", "人應遵守超越個人私欲的公共準則", "只追求個人利益", "拒絕所有改變"], "answer": 1, "explanation": "一課重法治，一課重土地倫理。"}, {"id": 45, "lesson": "語文常識三", "question": "「不卑不亢」最適合形容誰？", "options": ["面對權勢仍態度得體、堅守原則的人", "畏縮不語的人", "盛氣凌人的人", "反覆無常的人"], "answer": 0, "explanation": "成語兼具不自卑與不高傲。"}, {"id": 46, "lesson": "語文常識三", "question": "「怙惡不悛」意指什麼？", "options": ["勤學不倦", "善於納諫", "重信守諾", "堅持作惡而不悔改"], "answer": 3, "explanation": "怙惡不悛是強烈貶義。"}, {"id": 47, "lesson": "閱讀策略", "question": "人物特質題最可靠的依據是什麼？", "options": ["個人喜好", "人物姓名", "人物具體言行", "選項長度"], "answer": 2, "explanation": "必須以文本證據推論。"}, {"id": 48, "lesson": "閱讀策略", "question": "選項加入原文沒有的動機時，應如何處理？", "options": ["只看字數", "視為過度推論，優先排除", "當作合理補充", "一定選它"], "answer": 1, "explanation": "答案要有文本依據。"}, {"id": 49, "lesson": "閱讀策略", "question": "主旨題應優先觀察什麼？", "options": ["轉折、反覆概念與結尾", "標點數量", "字體大小", "人物姓名"], "answer": 0, "explanation": "核心意義通常集中在這些位置。"}, {"id": 50, "lesson": "第三次段考統整", "question": "正式試卷原始配分若為單題52分、題組42分，總分是多少？", "options": ["90分", "96分", "100分", "94分"], "answer": 3, "explanation": "52加42等於94。"}];let name='',started=false,done=false;function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(){quiz.innerHTML='';bank.forEach((x,i)=>{let d=document.createElement('section');d.className='question';d.id='qcard'+i;d.innerHTML='<span class="tag">'+esc(x.lesson)+'</span><h3>'+(i+1)+'. '+esc(x.question)+'</h3>';x.options.forEach((o,k)=>{let l=document.createElement('label');l.className='option';l.innerHTML='<input type="radio" name="q'+i+'" value="'+k+'"><span>'+String.fromCharCode(65+k)+'. '+esc(o)+'</span>';d.appendChild(l)});quiz.appendChild(d)});progress.textContent='本次共50題';submit.disabled=false;done=false;result.innerHTML=''}confirm.onclick=()=>{name=studentName.value.trim();if(!name){msg.textContent='⚠️ 請輸入姓名';return}localStorage.setItem('currentStudentName',name);studentName.disabled=true;confirm.disabled=true;msg.textContent='✅ 作答者：'+name;started=true;render()};submit.onclick=()=>{if(done||!started)return;let n=0,u=0,wrong=[];bank.forEach((x,i)=>{let s=document.querySelector('input[name=q'+i+']:checked'),a=s?+s.value:null,card=document.getElementById('qcard'+i);card.classList.remove('unanswered');if(a===null){u++;card.classList.add('unanswered')}if(a===x.answer)n++;else wrong.push({id:x.id,lesson:x.lesson,question:x.question,userAnswer:a===null?'未作答':x.options[a],correct:x.options[x.answer],explanation:x.explanation,date:new Date().toLocaleString('zh-TW')})});let pct=Math.round(n/50*100),out='<div class="card good"><h2>🎯 '+n+'/50，成績 '+pct+' 分</h2><p>作答者：'+esc(name)+'｜未作答：'+u+'題</p></div>';wrong.forEach((x,i)=>out+='<div class="wrong"><b>錯題'+(i+1)+' ['+esc(x.lesson)+']</b><p>'+esc(x.question)+'</p><p>你的答案：'+esc(x.userAnswer)+'</p><p><b>正確答案：'+esc(x.correct)+'</b></p><p>解析：'+esc(x.explanation)+'</p></div>');result.innerHTML=out;localStorage.setItem('chinese_exam3_score',String(pct));let hist=[];try{hist=JSON.parse(localStorage.getItem('scoreHistory')||'[]')}catch(e){}hist.push({studentName:name,source:'第三次段考50題模擬考',date:new Date().toLocaleString('zh-TW'),score:pct,correct:n,total:50,unanswered:u});localStorage.setItem('scoreHistory',JSON.stringify(hist));let wb=[];try{wb=JSON.parse(localStorage.getItem('wrongbook')||'[]')}catch(e){}wrong.forEach(x=>{let j=wb.findIndex(y=>y.lesson===x.lesson&&y.question===x.question);if(j>=0)wb[j]=x;else wb.push(x)});localStorage.setItem('wrongbook',JSON.stringify(wb));done=true;submit.disabled=true;result.scrollIntoView({behavior:'smooth'})};retry.onclick=()=>{if(!started)return alert('請先確認姓名');if(confirm('確定清除目前答案並重新開始？'))render()};studentName.value=localStorage.getItem('currentStudentName')||'';</script></body></html>
