<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史成績紀錄</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;color:#263238;background:#f5f6f8;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:18px;line-height:1.7}
    header{padding:30px 20px;color:white;text-align:center;background:#009688}
    header h1{margin:0 0 8px;font-size:34px} header p{margin:0}
    nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:13px;background:white;box-shadow:0 2px 7px rgba(0,0,0,.1)}
    nav a{padding:9px 15px;color:#00796b;background:#e0f2f1;border-radius:7px;text-decoration:none;font-weight:bold}
    nav a:hover{color:white;background:#00897b}
    .container{max-width:1000px;margin:auto;padding:22px}
    .card{padding:22px;margin-bottom:20px;background:white;border-radius:11px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    h2{margin-top:0;color:#00695c}
    .notice{padding:15px;margin-bottom:18px;background:#fff8e1;border-left:6px solid #ffb300;border-radius:8px}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}
    .stat-box{padding:18px;background:#e0f2f1;border-radius:10px;text-align:center}
    .stat-number{display:block;color:#00695c;font-size:30px;font-weight:bold}
    .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
    select{padding:9px 12px;border:1px solid #b0bec5;border-radius:6px;font-family:inherit;font-size:16px}
    .record{padding:17px;margin-bottom:13px;background:#f8f9fa;border-left:6px solid #009688;border-radius:7px}
    .record h3{margin:0 0 8px;color:#00695c}.record p{margin:4px 0}
    .student-name{font-size:20px;font-weight:bold;color:#1565c0}
    .score-good{color:#2e7d32;font-weight:bold}.score-normal{color:#ef6c00;font-weight:bold}.score-low{color:#c62828;font-weight:bold}
    .empty{padding:25px;color:#607d8b;background:#f7f9fb;border:2px dashed #b0bec5;border-radius:10px;text-align:center}
    button{padding:11px 20px;color:white;background:#e53935;border:0;border-radius:6px;cursor:pointer;font-size:16px;font-weight:bold}
    button:hover{background:#c62828}
    @media(max-width:600px){header h1{font-size:27px}.container{padding:12px}.stat-grid{grid-template-columns:1fr 1fr}nav a{flex:1 1 42%;text-align:center}}
  </style>
</head>
<body>
<header>
  <h1>📊 歷史成績紀錄</h1>
  <p>JOSH 勛 國文搶救大作戰</p>
</header>
<nav>
  <a href="index.html">🏠 國文首頁</a>
  <a href="quiz_v3.html">🎯 50題模擬考</a>
  <a href="exam1.html">📝 第一次段考總複習</a>
  <a href="wrongbook.html">❌ 錯題本</a>
</nav>
<main class="container">
  <section class="card">
    <h2>成績統計</h2>
    <div class="notice">成績與姓名只保存在目前這台裝置及瀏覽器。換裝置、換瀏覽器、使用無痕模式或清除網站資料時，紀錄不會自動同步。</div>
    <div id="summary">資料讀取中……</div>
  </section>
  <section class="card">
    <h2>歷史紀錄</h2>
    <div class="filter-row">
      <label for="studentFilter"><strong>依姓名篩選：</strong></label>
      <select id="studentFilter"><option value="">全部學生</option></select>
    </div>
    <div id="history">資料讀取中……</div>
  </section>
  <section class="card"><button id="clearButton" type="button">🗑 清除所有成績紀錄</button></section>
</main>
<script>
"use strict";
function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function readArray(key){try{const data=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(data)?data:[]}catch(error){console.error("無法讀取 "+key,error);return[]}}
function normalize(records,sourceName){return records.map(function(record){if(typeof record==="number")return{studentName:"未填姓名",source:sourceName,date:"舊版紀錄",score:record,correct:null,total:null,unanswered:null};if(!record||typeof record!=="object")return null;const score=Number(record.score);if(Number.isNaN(score))return null;return{studentName:record.studentName||record.name||"未填姓名",source:record.source||sourceName,date:record.date||"未記錄日期",score:score,correct:record.correct!==undefined?Number(record.correct):null,total:record.total!==undefined?Number(record.total):null,unanswered:record.unanswered!==undefined?Number(record.unanswered):null}}).filter(Boolean)}
function getAllScores(){let all=[];all=all.concat(normalize(readArray("scoreHistory"),"第一次段考50題模擬考"));all=all.concat(normalize(readArray("exam1ReviewQuizHistory"),"第一次段考重點小測驗"));all=all.concat(normalize(readArray("lesson1ScoreHistory"),"第1課小測驗"));all=all.concat(normalize(readArray("lesson2ScoreHistory"),"第2課小測驗"));all=all.concat(normalize(readArray("lesson3ScoreHistory"),"第3課小測驗"));return all}
const allScores=getAllScores();
function scoreClass(score){return score>=80?"score-good":score>=60?"score-normal":"score-low"}
function populateFilter(){const select=document.getElementById("studentFilter");const names=[...new Set(allScores.map(x=>x.studentName))].sort();names.forEach(function(name){const option=document.createElement("option");option.value=name;option.textContent=name;select.appendChild(option)})}
function render(selectedName=""){const scores=selectedName?allScores.filter(x=>x.studentName===selectedName):allScores;const summary=document.getElementById("summary");const history=document.getElementById("history");if(scores.length===0){summary.innerHTML='<div class="empty"><h3>目前尚無成績紀錄</h3><p>請先完成測驗並按下提交。</p></div>';history.innerHTML='<div class="empty">完成測驗後，姓名與成績會顯示在這裡。</div>';return}const values=scores.map(x=>x.score);const latest=scores[scores.length-1].score;const highest=Math.max(...values);const average=(values.reduce((a,b)=>a+b,0)/values.length).toFixed(1);summary.innerHTML='<div class="stat-grid"><div class="stat-box"><span class="stat-number">'+latest+'</span>最新成績</div><div class="stat-box"><span class="stat-number">'+highest+'</span>最高成績</div><div class="stat-box"><span class="stat-number">'+average+'</span>平均成績</div><div class="stat-box"><span class="stat-number">'+scores.length+'</span>測驗次數</div></div>';let html="";scores.slice().reverse().forEach(function(item){html+='<article class="record"><h3>'+escapeHtml(item.source)+'</h3><p class="student-name">👤 作答者：'+escapeHtml(item.studentName)+'</p><p>📅 日期：'+escapeHtml(item.date)+'</p><p class="'+scoreClass(item.score)+'">📊 成績：'+item.score+' 分</p>';if(item.correct!==null&&item.total!==null)html+='<p>✅ 答對：'+item.correct+' / '+item.total+' 題</p>';if(item.unanswered!==null)html+='<p>⚠️ 未作答：'+item.unanswered+' 題</p>';html+='</article>'});history.innerHTML=html}
document.getElementById("studentFilter").addEventListener("change",function(){render(this.value)});
document.getElementById("clearButton").addEventListener("click",function(){if(!confirm("確定要清除所有歷史成績嗎？"))return;["scoreHistory","exam1ReviewQuizHistory","lesson1ScoreHistory","lesson2ScoreHistory","lesson3ScoreHistory","lesson1LatestScore","lesson2LatestScore","lesson3LatestScore","chinese_exam1_score"].forEach(key=>localStorage.removeItem(key));location.reload()});
populateFilter();render();
</script>
</body>
</html>
