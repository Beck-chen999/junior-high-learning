<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國文錯題本｜JOSH 勛</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#263238;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:17px;line-height:1.7}header{padding:34px 18px;color:#fff;text-align:center;background:linear-gradient(135deg,#b71c1c,#e53935,#ff7043)}header h1{margin:0 0 6px;font-size:38px}.wrap{max-width:1050px;margin:auto;padding:22px 16px}.toolbar,.card,.empty{margin-bottom:18px;padding:20px;background:#fff;border-radius:12px;box-shadow:0 3px 10px #0001}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:20}.toolbar a,.toolbar button{padding:9px 14px;border:0;border-radius:7px;color:#fff;background:#c62828;text-decoration:none;font:700 16px inherit;cursor:pointer}.toolbar .secondary{background:#546e7a}.toolbar .danger{background:#8e0000}select,input{padding:9px 12px;border:1px solid #b0bec5;border-radius:7px;font:inherit}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat{padding:15px;background:#fff;border-radius:10px;text-align:center;box-shadow:0 2px 7px #0001}.stat b{display:block;color:#c62828;font-size:26px}.tag{display:inline-block;padding:3px 10px;background:#ffebee;color:#b71c1c;border-radius:18px;font-size:14px;font-weight:bold}.card h3{margin:10px 0}.answer{padding:12px;background:#f7f9fb;border-radius:8px}.correct{border-left:5px solid #43a047}.user{border-left:5px solid #e53935}.analysis{margin-top:13px;padding:15px;background:#fff8e1;border-left:5px solid #ffb300;border-radius:8px}.key{margin-top:10px;padding:12px;background:#e3f2fd;border-left:5px solid #1976d2;border-radius:7px}.trap{margin-top:10px;padding:12px;background:#fce4ec;border-left:5px solid #d81b60;border-radius:7px}.meta{color:#607d8b;font-size:14px}.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.row-actions button{padding:8px 13px;border:0;border-radius:7px;color:#fff;background:#607d8b;cursor:pointer}.row-actions .remove{background:#c62828}.empty{text-align:center;padding:45px 20px}.empty h2{color:#607d8b}@media(max-width:650px){header h1{font-size:29px}.wrap{padding:10px}.toolbar{position:static}.toolbar a,.toolbar button,select,input{width:100%}}</style></head><body><header><h1>❌ 國文錯題本</h1><p>同步顯示答案解析、解題關鍵與易錯提醒</p></header><main class="wrap"><div class="toolbar"><a href="index.html">🏠 國文首頁</a><a href="score.html" class="secondary">📊 歷史成績</a><select id="lessonFilter"><option value="">全部課次</option></select><input id="search" type="search" placeholder="搜尋題目或解析"><button id="clear" class="danger">清空錯題本</button></div><div class="stats"><div class="stat"><b id="total">0</b>錯題總數</div><div class="stat"><b id="shown">0</b>目前顯示</div><div class="stat"><b id="withAnalysis">0</b>含完整解析</div></div><div id="list"></div></main><script>
'use strict';const key='wrongbook';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){data=[]}if(!Array.isArray(data))data=[];const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function save(){localStorage.setItem(key,JSON.stringify(data))}function options(){const lessons=[...new Set(data.map(x=>x.lesson||x.source||'未分類'))].sort();lessonFilter.innerHTML='<option value="">全部課次</option>'+lessons.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}function render(){const lesson=lessonFilter.value,term=search.value.trim().toLowerCase();const rows=data.filter(x=>{const l=x.lesson||x.source||'未分類';const text=[l,x.question,x.userAnswer,x.correct,x.explanation,x.key,x.trap].join(' ').toLowerCase();return(!lesson||l===lesson)&&(!term||text.includes(term))});total.textContent=data.length;shown.textContent=rows.length;withAnalysis.textContent=data.filter(x=>x.explanation||x.key||x.trap).length;if(!rows.length){list.innerHTML='<div class="empty"><h2>目前沒有符合條件的錯題</h2><p>完成第二、三次段考模擬考後，錯題會自動出現在這裡。</p></div>';return}list.innerHTML=rows.map(x=>{const idx=data.indexOf(x),lesson=x.lesson||x.source||'未分類';return '<article class="card"><span class="tag">'+esc(lesson)+'</span><h3>'+esc(x.question||'未提供題目')+'</h3><div class="answer user"><b>你的答案：</b>'+esc(x.userAnswer||'未作答')+'</div><div class="answer correct"><b>正確答案：</b>'+esc(x.correct||x.correctAnswer||'未提供')+'</div><div class="analysis"><b>📘 答案解析</b><p>'+esc(x.explanation||'此筆舊錯題尚未包含解析，重新完成新版模擬考後即可同步。')+'</p></div><div class="key"><b>🔑 解題關鍵</b><p>'+esc(x.key||'先圈出題幹限制詞，再回到課文主旨或文本證據逐一排除。')+'</p></div><div class="trap"><b>⚠️ 易錯提醒</b><p>'+esc(x.trap||'不要只因選項出現熟悉詞語就選擇，必須檢查完整語意。')+'</p></div><p class="meta">記錄時間：'+esc(x.date||'未記錄')+'</p><div class="row-actions"><button onclick="copyItem('+idx+')">複製解析</button><button class="remove" onclick="removeItem('+idx+')">已會，移除</button></div></article>'}).join('')}window.removeItem=i=>{data.splice(i,1);save();options();render()};window.copyItem=i=>{const x=data[i],text='題目：'+(x.question||'')+'\n你的答案：'+(x.userAnswer||'')+'\n正確答案：'+(x.correct||x.correctAnswer||'')+'\n解析：'+(x.explanation||'')+'\n解題關鍵：'+(x.key||'')+'\n易錯提醒：'+(x.trap||'');navigator.clipboard?.writeText(text).then(()=>alert('解析已複製')).catch(()=>alert('瀏覽器不支援自動複製'))};lessonFilter.onchange=render;search.oninput=render;clear.onclick=()=>{if(confirm('確定清空全部錯題與解析嗎？')){data=[];save();options();render()}};options();render();</script></body></html>
