<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歷史第2章｜民族與文化</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:linear-gradient(135deg,#37474f,#607d8b);color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}nav a{background:#eceff1;color:#37474f}.btn,button{background:#00695c;color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}.panel,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.wrong{border-left:6px solid #e53935}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.answer{padding:13px;background:#f5f7fa;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:20px;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}button{width:100%}}</style></head><body><header><h1>歷史第2章｜民族與文化</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">50題模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a></nav><main class="wrap"><section class="panel"><h2>章節學習重點</h2><p>先閱讀本章核心說明，再完成頁面下方10題理解檢核。達到80分以上表示基本掌握；未滿80分建議返回重點複習後再測一次。</p></section><section class="panel"><h2>1. 張騫通西域原始目的？</h2><p>軍事目的後來促進絲路交流。</p></section><section class="panel"><h2>2. 絲路交流特色？</h2><p>物產、宗教與技術皆可移動。</p></section><section class="panel"><h2>3. 北人南遷主要影響？</h2><p>人口與技術南移。</p></section><section class="panel"><h2>4. 北魏孝文帝政策？</h2><p>遷都洛陽、改漢姓、說漢語。</p></section><section class="panel"><h2>5. 佛教源自何地？</h2><p>經陸海交通傳入中國。</p></section><section class="panel"><h2>本章10題理解檢核</h2><div class="toolbar"><button id="start">開始作答</button><button id="retry">重新測驗</button></div><p id="status">尚未開始</p></section><div id="quiz"></div><button id="submit" style="display:none">提交本章測驗</button><div id="result"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>const Q=[{"id":"history2.html-1","question":"張騫通西域原始目的？","options":["聯合西域夾擊匈奴","傳播佛教","建立科舉","改革日本"],"answer":0,"explanation":"軍事目的後來促進絲路交流。"},{"id":"history2.html-2","question":"絲路交流特色？","options":["商品文化雙向流動","只有中國輸出","只有官方使節","完全沒有宗教"],"answer":0,"explanation":"物產、宗教與技術皆可移動。"},{"id":"history2.html-3","question":"北人南遷主要影響？","options":["促進江南開發","南方農業消失","科舉廢除","世族立刻消失"],"answer":0,"explanation":"人口與技術南移。"},{"id":"history2.html-4","question":"北魏孝文帝政策？","options":["漢化政策","商鞅變法","大化革新","罷黜百家"],"answer":0,"explanation":"遷都洛陽、改漢姓、說漢語。"},{"id":"history2.html-5","question":"佛教源自何地？","options":["印度","日本","阿拉伯","中國"],"answer":0,"explanation":"經陸海交通傳入中國。"},{"id":"history2.html-6","question":"佛教中國化說明？","options":["外來文化會在地化","完全取代本土","交流只單向","佛教原產中國"],"answer":0,"explanation":"文化傳播會被重新解釋。"},{"id":"history2.html-7","question":"天可汗指哪位君主？","options":["唐太宗","漢武帝","秦始皇","隋煬帝"],"answer":0,"explanation":"反映唐初民族政策與威望。"},{"id":"history2.html-8","question":"文成公主前往何地？","options":["吐蕃","新羅","日本","大食"],"answer":0,"explanation":"和親促進漢藏交流。"},{"id":"history2.html-9","question":"日本學習唐制改革稱？","options":["大化革新","商鞅變法","漢化政策","科舉改革"],"answer":0,"explanation":"日本吸收隋唐制度後在地調整。"},{"id":"history2.html-10","question":"怛羅斯之役促成何者西傳？","options":["造紙術","火藥","指南針","印刷術"],"answer":0,"explanation":"被俘工匠使造紙技術向西傳播。"}],$=x=>document.getElementById(x);let E=[];function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){E=sh(Q).map(x=>{x={...x,options:[...x.options]};let c=x.options[x.answer];x.options=sh(x.options);x.answer=x.options.indexOf(c);return x});quiz.innerHTML=E.map((x,i)=>`<section class=q><span class=tag>本章檢核</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class=opt><input type=radio name=c${i} value=${k}> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('');status.textContent='共10題，每題10分';submit.style.display='inline-block';result.innerHTML=''}start.onclick=render;retry.onclick=render;submit.onclick=()=>{let c=0,w=[];E.forEach((x,i)=>{let e=document.querySelector(`input[name=c${i}]:checked`),a=e?+e.value:null;if(a===x.answer)c++;else w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],subject:'歷史第2章',chapter:'歷史第2章｜民族與文化',baseKey:x.id,successCount:0})});let score=c*10;result.innerHTML=`<section class="panel ${score>=80?'key':'note'}"><h2>${score}分｜答對 ${c}/10</h2><p>${score>=80?'本章基本概念已掌握。':'建議重新閱讀本章重點後再測一次。'}</p></section>`+w.map((x,i)=>`<section class="panel wrong"><h3>錯題 ${i+1}｜${x.question}</h3><p><b>你的答案：</b>${x.userAnswer}</p><p><b>正確答案：</b>${x.correctAnswer}</p><div class=answer><b>解析：</b>${x.explanation}</div></section>`).join('');let wb=[];try{wb=JSON.parse(localStorage.getItem('social_wrongbook')||'[]')}catch(e){}w.forEach(x=>{let i=wb.findIndex(y=>(y.baseKey||y.id)===x.baseKey);i>=0?wb[i]=x:wb.push(x)});localStorage.setItem('social_wrongbook',JSON.stringify(wb));let h=[];try{h=JSON.parse(localStorage.getItem('social_scoreHistory')||'[]')}catch(e){}h.unshift({mode:'章節測驗',name:localStorage.getItem('social_currentStudentName')||'',chapter:'歷史第2章｜民族與文化',score,correct:c,total:10,date:new Date().toLocaleString('zh-TW')});localStorage.setItem('social_scoreHistory',JSON.stringify(h));window.scrollTo({top:result.offsetTop,behavior:'smooth'})};</script></body></html>
