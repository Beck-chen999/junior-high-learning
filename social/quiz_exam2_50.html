=>{let c=0,w=[],by={地理:[0,0],歷史:[0,0],公民:[0,0]};E.forEach((x,i)=>{let e=document.querySelector(`input[name=q${i}]:checked`),a=e?+e.value:null,ok=a===x.answer;by[x.subject][1]++;if(ok){c++;by[x.subject][0]++}else w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer]})});$('result').innerHTML=`<section class="panel key"><h2>${c*2}分｜答對 ${c}/50</h2><p>地理 ${by.地理[0]}/${by.地理[1]}｜歷史 ${by.歷史[0]}/${by.歷史[1]}｜公民 ${by.公民[0]}/${by.公民[1]}</p></section>`+w.map((x,i)=>`<section class="panel wrong"><span class="core">${x.subject}｜${x.core}</span><h3>錯題 ${i+1}｜${x.question}</h3><p>你的答案：${x.userAnswer}</p><p>正確答案：${x.correctAnswer}</p><div class="answer">解析：${x.explanation}</div></section>`).join('');$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>
