et E=[];function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function updateStats(x,ok){let s=read('social_exam2_questionStats',{}),k=x.baseKey||x.id,a=s[k]||{subject:x.subject,chapter:x.chapter,core:x.core,question:x.question,attempts:0,correct:0};a.attempts++;if(ok)a.correct++;a.lastCorrect=ok;s[k]=a;save('social_exam2_questionStats',s)}function recordWrong(x,a){let w=read('social_exam2_wrongbook',[]),k=x.baseKey||x.id,i=w.findIndex(y=>(y.baseKey||y.id)===k),r={...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],successCount:0,lastCorrect:false,date:new Date().toLocaleString('zh-TW')};if(i>=0)w[i]={...w[i],...r};else w.push(r);save('social_exam2_wrongbook',w)}function recordScore(r){let h=read('social_exam2_scoreHistory',[]);h.unshift(r);save('social_exam2_scoreHistory',h)}function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function prep(x){x={...x,options:[...x.options]};let c=x.options[x.answer];x.options=sh(x.options);x.answer=x.options.indexOf(c);return x}function pick(s,n){let g={};Q.filter(x=>x.subject===s).forEach(x=>(g[x.baseKey]??=[]).push(x));return sh(Object.values(g)).slice(0,n).map(a=>prep(a[Math.floor(Math.random()*a.length)]))}function render(){E=sh([...pick('地理',18),...pick('歷史',17),...pick('公民',15)]);$('quiz').innerHTML=E.map((x,i)=>`<section class="q"><span class="tag">${x.subject}</span><span class="core">${x.core}</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" value="${k}"> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('');$('status').textContent='已抽出50題';$('submit').style.display='inline-block';$('result').innerHTML=''}$('start').onclick=render;$('retry').onclick=render;$('submit').onclick=()=>{let c=0,w=[],by={地理:[0,0],歷史:[0,0],公民:[0,0]};E.forEach((x,i)=>{let e=document.querySelector(`input[name=q${i}]:checked`),a=e?+e.value:null,ok=a===x.answer;updateStats(x,ok);by[x.subject][1]++;if(ok){c++;by[x.subject][0]++}else{recordWrong(x,a);w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer]})}});let score=c*2;recordScore({mode:'50題模擬考',score,correct:c,total:50,bySubject:by,date:new Date().toLocaleString('zh-TW')});save('social_exam2_lastAttempt',E);$('result').innerHTML=`<section class="panel key"><h2>${score}分｜答對 ${c}/50</h2><p>地理 ${by.地理[0]}/${by.地理[1]}｜歷史 ${by.歷史[0]}/${by.歷史[1]}｜公民 ${by.公民[0]}/${by.公民[1]}</p><p><a class="btn" href="analysis_exam2.html">查看二段分析</a> <a class="btn" href="wrongbook_exam2.html">重做二段錯題</a> <a class="btn" href="score_exam2.html">二段成績</a></p></section>`+w.map((x,i)=>`<section class="panel wrong"><span class="core">${x.subject}｜${x.core}</span><h3>錯題 ${i+1}｜${x.question}</h3><p>你的答案：${x.userAnswer}</p><p>正確答案：${x.correctAnswer}</p><div class="answer">解析：${x.explanation}</div></section>`).join('');$('result').scrollIntoView({behavior:'smooth'})};</script></body></html>
