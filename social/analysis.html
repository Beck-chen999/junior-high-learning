<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社會科學習分析</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:#455a64;color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff}nav a,.btn{padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:bold}nav a{background:#eceff1;color:#37474f}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.card,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{display:flex;flex-direction:column;min-height:220px;border-top:6px solid var(--c,#546e7a)}.card p{flex:1}.btn,button{background:#00695c;color:#fff;border:0;cursor:pointer}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.opt{display:block;padding:9px;margin:7px 0;border:1px solid #ccc;border-radius:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,button{padding:10px;font:inherit;border-radius:7px}footer{padding:20px;text-align:center;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}.toolbar input,.toolbar button{width:100%}}.stat{padding:16px;border-radius:12px;background:#fff;box-shadow:0 2px 10px #0001}.bar{height:13px;background:#eceff1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00897b}.weak{border-left:6px solid #ef6c00}.mastered{border-left:6px solid #43a047}.wrong{border-left:6px solid #e53935}.answer-detail{margin-top:12px;padding:14px;background:#f5f7fa;border-radius:8px}.muted{color:#607d8b}</style></head><body><header><h1>社會科學習分析</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a><a href="score.html">成績</a></nav><main class="wrap"><section class="panel"><h2>學習分析儀表板</h2><p>依所有模擬考與錯題重做紀錄，分析各科、題型與章節表現。</p><button id="reset">清除分析資料</button></section><div id="overview" class="grid"></div><section class="panel"><h2>各科正確率</h2><div id="subjects"></div></section><section class="panel"><h2>弱點題型</h2><div id="types"></div></section><section class="panel"><h2>優先複習清單</h2><div id="weak"></div></section></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>'use strict';function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function pct(c,t){return t?Math.round(c/t*100):0}function row(name,c,t){const p=pct(c,t);return `<div style="margin:14px 0"><b>${name}</b>：${c}/${t}（${p}%）<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}function render(){const st=read('social_questionStats',{}),a=Object.values(st),w=read('social_wrongbook',[]),h=read('social_scoreHistory',[]),attempts=a.reduce((n,x)=>n+x.attempts,0),correct=a.reduce((n,x)=>n+x.correct,0);overview.innerHTML=`<div class=stat><h3>累計作答</h3><b>${attempts}題次</b></div><div class=stat><h3>整體正確率</h3><b>${pct(correct,attempts)}%</b></div><div class=stat><h3>待重做錯題</h3><b>${w.length}題</b></div><div class=stat><h3>考試紀錄</h3><b>${h.length}次</b></div>`;subjects.innerHTML=['地理','歷史','公民'].map(s=>{const x=a.filter(q=>q.subject===s);return row(s,x.reduce((n,q)=>n+q.correct,0),x.reduce((n,q)=>n+q.attempts,0))}).join('');const g={};a.forEach(q=>{const k=q.type||'綜合題';g[k]??={c:0,t:0};g[k].c+=q.correct;g[k].t+=q.attempts});types.innerHTML=Object.entries(g).sort((a,b)=>pct(a[1].c,a[1].t)-pct(b[1].c,b[1].t)).slice(0,10).map(([k,v])=>row(k,v.c,v.t)).join('')||'尚無資料';weak.innerHTML=a.filter(q=>q.attempts>=1&&pct(q.correct,q.attempts)<70).sort((x,y)=>pct(x.correct,x.attempts)-pct(y.correct,y.attempts)).slice(0,15).map(q=>`<div class="panel weak"><span class=tag>${q.subject}｜${q.type||'綜合題'}</span><p><b>${q.question}</b></p><p>正確率：${pct(q.correct,q.attempts)}%（${q.correct}/${q.attempts}）</p></div>`).join('')||'<div class="key">目前沒有明顯弱點，繼續保持。</div>'}reset.onclick=()=>{if(confirm('確定清除學習分析與成績紀錄？錯題本不會清除。')){localStorage.removeItem('social_questionStats');localStorage.removeItem('social_scoreHistory');render()}};render();</script></body></html>
