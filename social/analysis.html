<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社會科學習分析</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.7}header{padding:32px;text-align:center;background:#455a64;color:white}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:white}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;background:#00695c;color:white;text-decoration:none;font-weight:bold;cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:20px}.panel,.stat{background:white;padding:20px;margin-bottom:16px;border-radius:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.weak{border-left:6px solid #ef6c00}.tag{display:inline-block;padding:3px 9px;border-radius:18px;background:#e8f5e9;color:#2e7d32}.bar{height:13px;background:#eceff1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00897b}.answer{margin-top:12px;padding:14px;border-radius:9px;background:#f5f7fa}details summary{padding:10px;color:#00695c;cursor:pointer}footer{text-align:center;padding:20px;background:#263238;color:white}</style></head><body><header><h1>社會科學習分析</h1><p>優先複習清單含答案與解析</p></header><nav><a href="index.html">社會首頁</a><a href="quiz_exam1_50.html">模擬考</a><a href="wrongbook.html">錯題重做</a><a href="score.html">成績</a></nav><main class="wrap"><section class="panel"><h2>學習分析儀表板</h2><p>弱點題目可直接展開查看正確答案、解析、題幹關鍵、易錯提醒及對應章節。</p></section><div id="overview" class="grid"></div><section class="panel"><h2>各科正確率</h2><div id="subjects"></div></section><section class="panel"><h2>優先複習清單</h2><div id="weak"></div></section></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function pct(c,t){return t?Math.round(c/t*100):0}function row(n,c,t){let p=pct(c,t);return `<p><b>${n}</b>：${c}/${t}（${p}%）</p><div class=bar><div class=fill style="width:${p}%"></div></div>`}function addReview(key){let w=read('social_wrongbook',[]),last=read('social_lastAttempt',[]),x=last.find(q=>(q.baseKey||q.id)===key);if(!x)return alert('這題尚無完整作答資料，請先完成一次模擬考。');if(!w.some(q=>(q.baseKey||q.id)===key))w.push({...x,successCount:0,lastCorrect:false});localStorage.setItem('social_wrongbook',JSON.stringify(w));alert('已加入錯題重做中心')}function render(){let st=Object.values(read('social_questionStats',{})),w=read('social_wrongbook',[]),last=read('social_lastAttempt',[]),h=read('social_scoreHistory',[]),attempts=st.reduce((n,x)=>n+x.attempts,0),correct=st.reduce((n,x)=>n+x.correct,0);overview.innerHTML=`<div class=stat><h3>累計作答</h3><b>${attempts}題次</b></div><div class=stat><h3>整體正確率</h3><b>${pct(correct,attempts)}%</b></div><div class=stat><h3>待重做錯題</h3><b>${w.length}題</b></div><div class=stat><h3>考試紀錄</h3><b>${h.length}次</b></div>`;subjects.innerHTML=['地理','歷史','公民'].map(s=>{let a=st.filter(x=>x.subject===s);return row(s,a.reduce((n,x)=>n+x.correct,0),a.reduce((n,x)=>n+x.attempts,0))}).join('');let items=st.filter(x=>x.attempts&&pct(x.correct,x.attempts)<70).sort((a,b)=>pct(a.correct,a.attempts)-pct(b.correct,b.attempts)).slice(0,15);weak.innerHTML=items.map(q=>{let x=w.find(y=>(y.baseKey||y.id)===q.baseKey)||last.find(y=>(y.baseKey||y.id)===q.baseKey)||w.find(y=>y.subject===q.subject&&y.question===q.question)||last.find(y=>y.subject===q.subject&&y.question===q.question);return `<div class="panel weak"><span class=tag>${q.subject}｜${q.type||'綜合題'}</span><p><b>${q.question}</b></p><p>正確率：${pct(q.correct,q.attempts)}%（${q.correct}/${q.attempts}）</p>${x?`<details><summary><b>查看答案與解析</b></summary><div class=answer><p><b>正確答案：</b><span style="color:#2e7d32">${x.correctAnswer||x.options?.[x.answer]||'尚無資料'}</span></p><p><b>完整解析：</b>${x.explanation||'尚無解析'}</p><p><b>題幹關鍵：</b>${x.key||'尚無資料'}</p><p><b>易錯提醒：</b>${x.trap||'尚無資料'}</p><p><b>對應章節：</b>${x.chapter||x.subject}</p><button onclick="addReview('${x.baseKey||x.id}')">加入錯題重做</button></div></details>`:'<p>完成下一次模擬考後即可顯示答案與解析。</p>'}</div>`}).join('')||'<div class=panel>目前沒有低於70%的弱點題目。</div>'}render();</script></body></html>
