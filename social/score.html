<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社會科成績紀錄</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:#455a64;color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff}nav a,.btn{padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:bold}nav a{background:#eceff1;color:#37474f}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.card,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{display:flex;flex-direction:column;min-height:220px;border-top:6px solid var(--c,#546e7a)}.card p{flex:1}.btn,button{background:#00695c;color:#fff;border:0;cursor:pointer}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.opt{display:block;padding:9px;margin:7px 0;border:1px solid #ccc;border-radius:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,button{padding:10px;font:inherit;border-radius:7px}footer{padding:20px;text-align:center;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}.toolbar input,.toolbar button{width:100%}}.stat{padding:16px;border-radius:12px;background:#fff;box-shadow:0 2px 10px #0001}.bar{height:13px;background:#eceff1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00897b}.weak{border-left:6px solid #ef6c00}.mastered{border-left:6px solid #43a047}.wrong{border-left:6px solid #e53935}.answer-detail{margin-top:12px;padding:14px;background:#f5f7fa;border-radius:8px}.muted{color:#607d8b}</style></head><body><header><h1>社會科成績紀錄</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a><a href="score.html">成績</a></nav><main class="wrap"><section class="panel"><h2>成績紀錄</h2><p><a class="btn" href="analysis.html">查看完整學習分析</a></p><button id="clearScores">清空成績</button></section><div id="scores"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>function read(){try{return JSON.parse(localStorage.getItem('social_scoreHistory')||'[]')}catch(e){return []}}function render(){const a=read();scores.innerHTML=a.length?a.map((x,i)=>`<section class="panel"><span class="tag">${x.mode||'模擬考'}</span><h3>${i+1}. ${x.name||'未命名'}｜${x.score}分</h3><p>${x.correct??'-'}/${x.total??'-'}｜${x.date}</p>${x.bySubject?'<p>'+x.bySubject.map(s=>s.subject+' '+s.correct+'/'+s.total).join('｜')+'</p>':''}</section>`).join(''):'<section class="panel">尚無成績。</section>'}clearScores.onclick=()=>{if(confirm('確定清空成績？')){localStorage.removeItem('social_scoreHistory');render()}};render();</script></body></html>
