<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二次段考錯題重做</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.72}header{padding:34px 16px;text-align:center;background:linear-gradient(135deg,#37474f,#607d8b);color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;text-decoration:none;font-weight:700;cursor:pointer}nav a{background:#eceff1;color:#37474f}.btn,button{background:#00695c;color:#fff}.wrap{max-width:1080px;margin:auto;padding:20px}.panel,.q,.card{background:#fff;padding:21px;margin-bottom:17px;border-radius:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{border-top:6px solid var(--c,#546e7a)}.tag,.core{display:inline-block;padding:3px 9px;border-radius:18px}.tag{background:#e8f5e9;color:#2e7d32}.core{background:#e3f2fd;color:#0d47a1;margin-left:5px;font-weight:700}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.wrong{border-left:6px solid #e53935}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.answer{padding:13px;background:#f5f7fa;border-radius:8px}.bar{height:13px;background:#eceff1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00897b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#c62828}.stream1{--c:#546e7a}.stream2{--c:#00897b}footer{text-align:center;padding:20px;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}button{width:100%}nav{position:static}}</style></head><body><header><h1>第二次段考錯題重做</h1><p>翰林版八年級上｜第二次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam2.html">二段課程</a><a href="review_exam2.html">二段總複習</a><a href="quiz_exam2_50.html">二段模擬考</a><a href="wrongbook_exam2.html">二段錯題</a><a href="analysis_exam2.html">二段分析</a><a href="score_exam2.html">二段成績</a></nav><main class="wrap"><section class="panel"><h2>第二次段考錯題重做</h2><p>資料只來自二段章節測驗與二段50題模擬考。連續答對2次後移除。</p><button id="start">開始重做</button> <button id="clear" class="danger">清除二段錯題</button><span id="status"></span></section><div id="quiz"></div><button id="submit" type="button" style="display:none">提交重做答案</button><div id="result"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>'use strict';const $=x=>document.getElementById(x);let E=[];function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function updateStats(x,ok){let s=read('social_exam2_questionStats',{}),k=x.baseKey||x.id,a=s[k]||{subject:x.subject,chapter:x.chapter,core:x.core,question:x.question,attempts:0,correct:0};a.attempts++;if(ok)a.correct++;a.lastCorrect=ok;s[k]=a;save('social_exam2_questionStats',s)}function recordWrong(x,a){let w=read('social_exam2_wrongbook',[]),k=x.baseKey||x.id,i=w.findIndex(y=>(y.baseKey||y.id)===k),r={...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],successCount:0,lastCorrect:false,date:new Date().toLocaleString('zh-TW')};if(i>=0)w[i]={...w[i],...r};else w.push(r);save('social_exam2_wrongbook',w)}function recordScore(r){let h=read('social_exam2_scoreHistory',[]);h.unshift(r);save('social_exam2_scoreHistory',h)}function sh(a){return [...a].sort(()=>Math.random()-.5)}function render(){let w=read('social_exam2_wrongbook',[]);E=sh(w).slice(0,20);$('status').textContent=`目前錯題 ${w.length} 題，本次 ${E.length} 題`;$('quiz').innerHTML=E.map((x,i)=>`<section class="q"><span class="tag">${x.subject}</span><span class="core">${x.core}</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" value="${k}"> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('')||'<section class="panel key">目前沒有二段錯題。</section>';$('submit').style.display=E.length?'inline-block':'none'}$('start').onclick=render;$('submit').onclick=()=>{let w=read('social_exam2_wrongbook',[]),c=0;E.forEach((x,i)=>{let e=document.querySelector(`input[name=q${i}]:checked`),a=e?+e.value:null,ok=a===x.answer,k=x.baseKey||x.id,j=w.findIndex(y=>(y.baseKey||y.id)===k);updateStats(x,ok);if(ok){c++;if(j>=0){w[j].successCount=(w[j].successCount||0)+1;if(w[j].successCount>=2)w.splice(j,1)}}else if(j>=0)w[j].successCount=0});save('social_exam2_wrongbook',w);recordScore({mode:'錯題重做',score:E.length?Math.round(c/E.length*100):0,correct:c,total:E.length,date:new Date().toLocaleString('zh-TW')});$('result').innerHTML=`<section class="panel key"><h2>答對 ${c}/${E.length}</h2><p>剩餘二段錯題：${w.length}題</p></section>`;render()};$('clear').onclick=()=>{if(confirm('確定清除第二次段考錯題？')){save('social_exam2_wrongbook',[]);render()}};render();</script></body></html>
