').disabled=$('startBtn').disabled=true;$('msg').textContent='作答者：'+n;started=true;render()};$('submitBtn').onclick=()=>{if(!started||done)return;let correct=0,wrong=[];bank.forEach((x,i)=>{const el=document.querySelector(`input[name=q${i}]:checked`),a=el?+el.value:null;if(a===x.answer)correct++;else wrong.push({subject:x.subject,chapter:x.chapter,question:x.question,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],explanation:x.explanation,key:x.key,trap:x.trap,date:new Date().toLocaleString('zh-TW')})});const score=correct*2;$('result').innerHTML=`<section class="panel key"><h2>成績 ${score} 分｜答對 ${correct} / 50</h2></section>`+wrong.map(x=>`<section class="wrong"><b>[${x.subject}] ${x.question}</b><p>你的答案：${x.userAnswer}</p><p>正確答案：${x.correctAnswer}</p><p>解析：${x.explanation}</p></section>`).join('');let wb=JSON.parse(localStorage.getItem('social_wrongbook')||'[]');wrong.forEach(x=>{const i=wb.findIndex(y=>y.question===x.question);i>=0?wb[i]=x:wb.push(x)});localStorage.setItem('social_wrongbook',JSON.stringify(wb));let hs=JSON.parse(localStorage.getItem('social_scoreHistory')||'[]');hs.unshift({name:localStorage.getItem('social_currentStudentName')||'',score,total:50,date:new Date().toLocaleString('zh-TW')});localStorage.setItem('social_scoreHistory',JSON.stringify(hs));localStorage.setItem('social_exam1_score',score);$('submitBtn').disabled=true;done=true;window.scrollTo({top:$('result').offsetTop,behavior:'smooth'})};$('retryBtn').onclick=()=>{if(started&&window.confirm('確定重新抽取50題？'))render()};$('studentName').value=localStorage.getItem('social_currentStudentName')||'';</script>
