trap":"東周不是郡縣制立刻全面完成。"},{"id":"歷6","subject":"歷史","chapter":"國家與社會","type":"比較題","question":"春秋時期諸侯常以「尊王攘夷」號召各國，戰國時期則以消滅對手、統一天下為目標。兩者差異最適合如何概括？","options":["春秋偏向爭霸，戰國偏向兼併","春秋重科舉，戰國重察舉","春秋中央集權，戰國封建穩固","春秋重佛教，戰國重道教"],"answer":0,"explanation":"春秋霸主仍借周天子名義維持秩序；戰國各國競爭更激烈，走向兼併統一。","key":"尊王攘夷、兼併","trap":"不能只用戰爭多寡區分，應看政治目標。"},{"id":"歷7","subject":"歷史","chapter":"國家與社會","type":"史料題","question":"某改革規定：人民按戶籍編組，鼓勵耕戰，以軍功授爵，並禁止私鬥。這套措施最可能出自哪位改革者？","options":["商鞅","孔子","張騫","北魏孝文帝"],"answer":0,"explanation":"商鞅變法以編戶、獎勵耕戰、軍功爵制等措施強化秦國。","key":"編戶、耕戰、軍功爵","trap":"看到軍功授爵要優先聯想到商鞅變法。"},{"id":"歷8","subject":"歷史","chapter":"國家與社會","type":"因果題","question":"戰國各國將人民編入戶籍、按土地徵稅並直接徵兵。這些措施共同造成何種政治影響？","options":["削弱貴族中介，強化國君對人民與資源的控制","恢復西周封建秩序","使地方官位世襲","促成佛教中國化"],"answer":0,"explanation":"編戶齊民使國家可直接掌握人口、賦稅與兵源，是中央集權發展的重要基礎。","key":"戶籍、徵稅、徵兵","trap":"不是為保障世族地位，而是加強國家控制。"},{"id":"歷9","subject":"歷史","chapter":"國家與社會","type":"人物題","question":"孔子主張透過教育與道德教化改善社會，並重視「仁」與「禮」。若某國君完全採納這套主張，最可能重視哪項措施？","options":["以德化民並恢復合宜的社會秩序","以嚴刑峻法控制人民","取消所有倫理規範","只以軍功選官"],"answer":0,"explanation":"儒家重仁、禮與德治，主張統治者以道德示範維持秩序。","key":"仁、禮、德治","trap":"嚴刑峻法較接近法家。"},{"id":"歷10","subject":"歷史","chapter":"國家與社會","type":"比較題","question":"戰國時，有思想家主張統治者應依靠明確法律、權術與威勢，不應只期待人民自動守德。這最接近哪一學派？","options":["法家","儒家","道家","墨家"],"answer":0,"explanation":"法家強調法、術、勢，適合戰國富國強兵與中央集權需求。","key":"法、術、勢","trap":"不要因題幹出現法律就直接聯想到現代法治。"},{"id":"歷11","subject":"歷史","chapter":"國家與社會","type":"人物題","question":"某學派反對奢侈喪葬與侵略戰爭，主張不分親疏地相互關愛。這是哪一學派的思想？","options":["墨家","儒家","法家","道家"],"answer":0,"explanation":"墨家主張兼愛、非攻、節用與節葬。","key":"兼愛、非攻、節用","trap":"儒家仁愛仍重視親疏次序，與兼愛不同。"},{"id":"歷12","subject":"歷史","chapter":"國家與社會","type":"概念題","question":"面對戰亂，有思想家主張統治者不要過度干預人民，應順應自然，減少欲望與爭奪。這最接近哪一主張？","options":["道家的無為思想","法家的嚴刑峻法","墨家的兼愛","儒家的禮治"],"answer":0,"explanation":"道家重視自然與無為，反對過度人為控制。","key":"順應自然、減少干預","trap":"無為不是什麼都不做，而是不妄為。"},{"id":"歷13","subject":"歷史","chapter":"國家與社會","type":"制度題","question":"秦統一後，皇帝把全國劃分為若干郡，郡下設縣，地方官由中央任免。這種制度與西周封建最大的差異是什麼？","options":["地方官不能世襲，中央可直接控制地方","地方完全自治","地方只需定期納貢","地方以血緣分封為核心"],"answer":0,"explanation":"郡縣制以中央任免官員取代世襲諸侯，強化中央集權。","key":"中央任免、郡縣","trap":"郡縣不是取消地方行政，而是改變控制方式。"},{"id":"歷14","subject":"歷史","chapter":"國家與社會","type":"因果題","question":"秦朝統一文字、貨幣、度量衡與車軌，這些政策最主要的共同效果為何？","options":["降低各地交流成本，便利帝國治理","恢復諸侯割據","扶植世族壟斷","使地方貨幣更加多元"],"answer":0,"explanation":"標準化有利行政命令、商業往來及交通整合。","key":"統一標準、交流、治理","trap":"不是單純文化控制，也有經濟與行政功能。"},{"id":"歷15","subject":"歷史","chapter":"國家與社會","type":"圖像題","question":"某圖先列出齊國刀幣、楚國蟻鼻錢、趙國布幣，接著顯示全國改用圓形方孔的半兩錢。圖中改革最可能發生在哪一時期？","options":["秦統一六國之後","西周初年","春秋早期","東漢末年"],"answer":0,"explanation":"秦統一後以半兩錢整合原本不同國家的貨幣。","key":"刀幣、布幣、半兩錢","trap":"半兩錢與五銖錢不可混淆。"},{"id":"歷16","subject":"歷史","chapter":"國家與社會","type":"史料題","question":"臣子上書指出：若分封皇子到各地，將來可能互相爭奪；應由朝廷直接任命地方官。這段主張最支持哪一制度？","options":["郡縣制度","封建制度","宗法制度","察舉制度"],"answer":0,"explanation":"由中央任命地方官、避免地方世襲割據，是郡縣制的核心。","key":"直接任命、地方官、中央","trap":"題幹批評的是封建可能造成割據。"},{"id":"歷17","subject":"歷史","chapter":"國家與社會","type":"因果題","question":"秦朝法律嚴苛、徭役繁重，統一後不久即爆發大規模反抗。這最能說明哪個歷史觀點？","options":["制度若缺乏適度調整，統治成本可能快速升高","中央集權必然無法運作","統一文字會直接引發內戰","封建制度一定優於郡縣"],"answer":0,"explanation":"秦亡原因複雜，嚴刑與沉重徭役加劇社會不滿。","key":"嚴刑、徭役、反抗","trap":"不可把秦亡完全歸因於單一政策。"},{"id":"歷18","subject":"歷史","chapter":"國家與社會","type":"制度題","question":"漢代地方官定期推薦品德良好、才能出眾者到中央任官。這種選才方式稱為什麼？","options":["察舉制度","科舉制度","九品官人之法","封建制度"],"answer":0,"explanation":"察舉由地方官推薦人才，孝廉是重要科目。","key":"地方推薦、孝廉","trap":"科舉以考試為主，察舉以推薦為主。"},{"id":"歷19","subject":"歷史","chapter":"國家與社會","type":"情境題","question":"一名漢代青年長期奉養父母、行為廉正，受到地方官注意並推薦入朝。這名青年最可能透過哪個管道成為官員？","options":["被察舉為孝廉","參加進士科考試","依九品定級","繼承諸侯爵位"],"answer":0,"explanation":"漢代察舉常以孝、廉等德行作為推薦標準。","key":"漢代、地方官、孝廉","trap":"漢代尚未形成成熟科舉。"},{"id":"歷20","subject":"歷史","chapter":"國家與社會","type":"制度題","question":"漢武帝設立太學，選拔學生研習儒家經典。這項措施的主要政治作用為何？","options":["培養認同中央理念的官僚人才","鼓勵地方諸侯世襲","廢除中央集權","推動佛教成為國教"],"answer":0,"explanation":"太學與儒學有助培養官員並建立共同政治思想。","key":"太學、儒家經典、官僚","trap":"不能簡化為只推廣一般教育。"},{"id":"歷21","subject":"歷史","chapter":"國家與社會","type":"史料題","question":"某人自稱家族數代高官，即使本人才能普通，仍因門第被評為上品。這種現象最可能出現在哪一制度運作後期？","options":["九品官人之法","察舉制度初期","科舉制度成熟期","秦朝郡縣制度"],"answer":0,"explanation":"九品官人法後期受世族控制，形成上品無寒門。","key":"門第、上品、世族","trap":"九品官人法初設並非只看家世，後期才日益門第化。"},{"id":"歷22","subject":"歷史","chapter":"國家與社會","type":"因果題","question":"魏晉南北朝時期，部分大族擁有土地、官位與婚姻網絡，形成「世族」。世族長期掌權與哪項制度關係最密切？","options":["九品官人之法逐漸重視門第","郡縣制全面廢除","科舉考試普及","封建諸侯重新出現"],"answer":0,"explanation":"九品中正官多由世族把持，選才逐漸依賴家世。","key":"世族、門第、九品","trap":"世族形成也與土地、婚姻有關，不能只看一項因素。"},{"id":"歷23","subject":"歷史","chapter":"國家與社會","type":"制度題","question":"隋唐政府以考試成績選拔官員，考生可以透過研讀經典與文章取得仕途機會。這項制度對政治最直接的影響為何？","options":["擴大中央選才範圍並削弱世族壟斷","使官位完全世襲","恢復封建諸侯","取消讀書教育"],"answer":0,"explanation":"科舉使中央可直接選才，增加平民讀書人入仕機會。","key":"考試、中央選才、世族","trap":"科舉增加機會，不代表人人條件完全平等。"},{"id":"歷24","subject":"歷史","chapter":"國家與社會","type":"比較題","question":"下列關於察舉、九品官人法與科舉的比較，何者正確？","options":["察舉重推薦，九品後期重門第，科舉重考試","三者都以公開考試為主","三者都只看血緣","科舉比察舉更早出現"],"answer":0,"explanation":"三種制度反映漢至隋唐選才方式的演變。","key":"推薦、門第、考試","trap":"需同時判斷方式與時代。"},{"id":"歷25","subject":"歷史","chapter":"國家與社會","type":"排序題","question":"若將「察舉孝廉、九品官人法、科舉取士」依出現先後排列，正確順序為何？","options":["察舉孝廉→九品官人法→科舉取士","九品官人法→察舉孝廉→科舉取士","科舉取士→察舉孝廉→九品官人法","察舉孝廉→科舉取士→九品官人法"],"answer":0,"explanation":"漢代察舉在前，魏晉九品居中，隋唐科舉在後。","key":"漢、魏晉、隋唐","trap":"用朝代時間軸避免只背制度名稱。"},{"id":"歷26","subject":"歷史","chapter":"國家與社會","type":"跨章題","question":"從西周封建、秦漢郡縣到隋唐科舉，長期發展的共同趨勢最適合如何描述？","options":["中央逐步加強對地方與官僚的控制","地方世襲勢力持續增強","血緣成為唯一選才標準","國家逐步放棄行政管理"],"answer":0,"explanation":"郡縣使中央控制地方，科舉使中央控制選官，皆有助中央集權。","key":"封建、郡縣、科舉","trap":"趨勢不是直線且無反覆，但整體中央權力增強。"},{"id":"歷27","subject":"歷史","chapter":"民族與文化","type":"情境題","question":"漢武帝派張騫前往西域，原本希望聯合其他勢力夾擊匈奴。雖然軍事目標未完全達成，這次行動卻帶來什麼長期影響？","options":["開啟漢與西域交通，促進絲路交流","直接建立科舉制度","使佛教立刻成為國教","促成日本大化革新"],"answer":0,"explanation":"張騫通西域使漢朝更了解中亞，並促進陸上交通與文化交換。","key":"張騫、西域、匈奴","trap":"原始目的和後續影響要分開。"},{"id":"歷28","subject":"歷史","chapter":"民族與文化","type":"資料題","question":"一份漢代市場清單出現葡萄、胡桃、苜蓿等商品；西方則出現中國絲綢。這份材料最能證明什麼？","options":["絲路促成物產雙向交流","所有商品都由中國向外輸出","漢代已控制全部歐洲","西域只具有軍事功能"],"answer":0,"explanation":"絲路不只輸出絲綢，也把西方與中亞物產帶入中國。","key":"葡萄、胡桃、苜蓿、絲綢","trap":"交流是雙向的，不是單向傳播。"},{"id":"歷29","subject":"歷史","chapter":"民族與文化","type":"比較題","question":"中原農業民族與北方草原民族長期互動，雙方既有戰爭也有互市。造成這種複雜關係的主要原因是什麼？","options":["生產方式與資源需求不同，既競爭又互補","雙方語言完全相同","草原民族只需要農作物","農業民族完全不需要馬匹"],"answer":0,"explanation":"農耕與畜牧經濟有不同資源，各自有需求，也會因邊界與資源衝突。","key":"農耕、畜牧、互市","trap":"不能把民族互動只理解為戰爭。"},{"id":"歷30","subject":"歷史","chapter":"民族與文化","type":"因果題","question":"西晉末年北方戰亂，大量人口南遷。這一移動最可能對南方造成什麼影響？","options":["帶入勞力與技術，促進江南開發","使南方農業立刻消失","造成科舉制度廢除","使北方世族全部消失"],"answer":0,"explanation":"北人南遷帶來人口、技術與生產經驗，加速南方經濟開發。","key":"北人南遷、江南開發","trap":"遷徙也可能帶來衝突，影響不是只有單一面向。"},{"id":"歷31","subject":"歷史","chapter":"民族與文化","type":"史料題","question":"北魏皇帝下令官員改用漢姓、穿漢服、說漢語，並將都城遷至洛陽。這些措施的主要目的為何？","options":["推動漢化並強化統治","恢復西周封建","推動海上絲路","建立科舉制度"],"answer":0,"explanation":"北魏孝文帝透過漢化政策整合統治，促進民族融合。","key":"漢姓、漢服、洛陽","trap":"漢化不等於北方民族完全消失。"},{"id":"歷32","subject":"歷史","chapter":"民族與文化","type":"人物題","question":"哪位統治者的政策最符合「遷都洛陽、改漢姓、鼓勵胡漢通婚」？","options":["北魏孝文帝","漢武帝","秦始皇","唐太宗"],"answer":0,"explanation":"這些是北魏孝文帝漢化政策的重要內容。","key":"洛陽、改漢姓、胡漢通婚","trap":"唐太宗重民族交流，但不是此組政策。"},{"id":"歷33","subject":"歷史","chapter":"民族與文化","type":"文化題","question":"佛教傳入中國後，經典被翻譯，思想與中國傳統結合，形成新的宗派與藝術形式。這一現象最能說明什麼？","options":["外來文化會在交流中產生在地化","外來文化必定完全取代本地文化","文化交流只有單向模仿","佛教原本起源於中國"],"answer":0,"explanation":"文化傳播常經選擇、解釋與改造，形成新的在地特色。","key":"翻譯、結合、宗派","trap":"中國化不代表佛教失去所有原始特徵。"},{"id":"歷34","subject":"歷史","chapter":"民族與文化","type":"因果題","question":"魏晉南北朝戰亂頻仍、社會不安，佛教卻逐漸流行。下列解釋何者最合理？","options":["佛教提供精神寄託，並透過譯經與寺院傳播","戰亂使交通完全中斷","政府強迫所有人出家","儒家經典完全消失"],"answer":0,"explanation":"亂世中的精神需求，加上僧侶活動與交通交流，推動佛教發展。","key":"戰亂、精神寄託、譯經","trap":"宗教發展通常有多重原因。"},{"id":"歷35","subject":"歷史","chapter":"民族與文化","type":"人物題","question":"某位唐代君主採取較開放的民族政策，被部分西北民族尊稱為「天可汗」。這位君主是誰？","options":["唐太宗","漢武帝","秦始皇","隋煬帝"],"answer":0,"explanation":"唐太宗以較開放方式處理民族關係，獲天可汗稱號。","key":"天可汗","trap":"不要將漢武帝抗匈奴與唐太宗民族政策混淆。"},{"id":"歷36","subject":"歷史","chapter":"民族與文化","type":"情境題","question":"吐蕃使者到長安迎接唐朝公主，並帶回農業、醫藥與工藝知識。這段情境最可能與哪件事有關？","options":["文成公主入藏","張騫通西域","玄奘西行","班超經營西域"],"answer":0,"explanation":"文成公主與吐蕃贊普和親，是唐與吐蕃交流的重要事件。","key":"吐蕃、公主、入藏","trap":"和親不是單純政治婚姻，也帶來文化交流。"},{"id":"歷37","subject":"歷史","chapter":"民族與文化","type":"比較題","question":"唐朝與周邊民族的關係包括戰爭、和親、冊封、通商與文化交流。這說明哪一觀點最合理？","options":["民族關係具有多元互動，不宜只以衝突理解","所有民族都完全服從唐朝","文化交流只發生在和平時期","和親能永久消除戰爭"],"answer":0,"explanation":"歷史上的民族關係會隨政治利益與力量變化，具有多重形式。","key":"戰爭、和親、冊封、通商","trap":"不要用單一事件概括長時期關係。"},{"id":"歷38","subject":"歷史","chapter":"民族與文化","type":"東亞題","question":"日本派遣使節與留學生到唐朝，返國後參考唐制改革中央官制、法律與土地制度。這類改革通常稱為什麼？","options":["大化革新","商鞅變法","孝文帝漢化","王安石變法"],"answer":0,"explanation":"日本大化革新受到隋唐制度文化影響。","key":"日本、唐制、改革","trap":"大化革新是日本在地改革，不是完全照抄。"},{"id":"歷39","subject":"歷史","chapter":"民族與文化","type":"概念題","question":"中國文字、儒家思想、佛教與律令制度影響日本、朝鮮半島與越南，形成所謂東亞文化圈。下列理解何者正確？","options":["各地共享部分文化元素，但仍保有自身特色","各地都由唐朝直接統治","各地語言與制度完全相同","只有商品往來，沒有思想交流"],"answer":0,"explanation":"文化圈代表文化共通性，不等於政治統一或完全一致。","key":"漢字、儒家、佛教、律令","trap":"文化圈不能等同帝國疆域。"},{"id":"歷40","subject":"歷史","chapter":"民族與文化","type":"事件題","question":"唐與大食軍隊在中亞交戰，部分中國工匠被帶往西方，造紙技術因而向西傳播。此事件為何？","options":["怛羅斯之役","赤壁之戰","安史之亂","淝水之戰"],"answer":0,"explanation":"怛羅斯之役與造紙術西傳常被連結。","key":"大食、中亞、造紙術","trap":"安史之亂發生在唐境內，與本題不同。"},{"id":"歷41","subject":"歷史","chapter":"民族與文化","type":"跨章題","question":"張騫通西域、佛教傳入、唐代胡樂流行、造紙術西傳，這些事件共同說明哪一歷史現象？","options":["交通網絡促進跨區域雙向文化交流","中國文化只向外輸出","外來文化完全取代中國文化","戰爭是唯一交流方式"],"answer":0,"explanation":"人員、商品、宗教與技術透過交通網絡雙向移動。","key":"西域、佛教、胡樂、造紙","trap":"要看共同概念，不要只選其中一個事件。"},{"id":"歷42","subject":"歷史","chapter":"大唐風情","type":"史料題","question":"詩人描述長安街頭可見外國商人、胡旋舞、葡萄酒與不同宗教寺院。這段材料最適合用來說明唐代哪一特色？","options":["長安國際化且文化多元","唐朝實行閉關政策","外國人不得居住長安","唐代只有儒家信仰"],"answer":0,"explanation":"人員、商品、音樂及宗教的多元性是長安國際城市的重要證據。","key":"外國商人、胡旋舞、葡萄酒、寺院","trap":"個別外來物品不能單獨證明全面國際化，需綜合判斷。"},{"id":"歷43","subject":"歷史","chapter":"大唐風情","type":"圖像題","question":"墓室壁畫描繪高鼻深目人物牽馬，旁邊有穿胡服者演奏琵琶。研究者最合理的推論是什麼？","options":["唐代社會與西域人群及文化往來密切","唐代禁止外來音樂","所有人物都是皇室成員","壁畫能證明唐朝統治歐洲"],"answer":0,"explanation":"圖像可反映外來人群、服飾與音樂在唐代社會中的存在。","key":"胡服、琵琶、西域人物","trap":"圖像只能支持合理推論，不能無限延伸。"},{"id":"歷44","subject":"歷史","chapter":"大唐風情","type":"史料判讀","question":"閱讀唐代筆記時，研究者發現內容提到胡餅、葡萄酒與外國商旅。若要提高史料可信度，最適合再搭配哪種資料？","options":["同時期墓葬壁畫、器物與官方文書","現代電視劇服裝","網路小說情節","後人未註明來源的傳說"],"answer":0,"explanation":"不同類型的同時期史料可交叉驗證。","key":"交叉驗證、同時期史料","trap":"現代作品可幫助想像，但不能直接證明史實。"},{"id":"歷45","subject":"歷史","chapter":"大唐風情","type":"因果題","question":"唐代能吸引外國使節、留學生與商人進入長安，與下列哪組條件關係最密切？","options":["國力強盛、交通發達與政策相對開放","徹底禁止民間貿易","只允許單一宗教","取消所有城市市場"],"answer":0,"explanation":"強盛政權、交通網與較開放政策共同促進國際交流。","key":"國力、交通、開放","trap":"交流繁榮通常不是單一原因造成。"},{"id":"歷46","subject":"歷史","chapter":"大唐風情","type":"比較題","question":"日本學習唐朝律令、城市規畫與文字文化，但仍依本身政治社會條件調整。這最能說明文化交流的哪一特性？","options":["文化接受者會選擇並在地化外來文化","外來制度一定原封不動移植","文化交流會消滅本地特色","政治制度與文化無關"],"answer":0,"explanation":"文化傳播常經選擇、改造與重新解釋。","key":"學習、調整、在地化","trap":"學習不等於完全複製。"},{"id":"歷47","subject":"歷史","chapter":"國家與社會","type":"題組1-1","question":"【題組】西周初年，受封諸侯在封地內管理人民、徵收賦役，並需服從天子、定期朝貢。依材料判斷，這套制度最初的主要優點為何？","options":["協助天子治理遠方並建立軍事支援網絡","完全消除諸侯叛亂","使地方官全部由考試產生","保障平民直接參政"],"answer":0,"explanation":"在交通與行政能力有限時，封建可擴大治理範圍並建立支援。","key":"封地、諸侯、朝貢","trap":"題目問最初優點，不是後來弊端。"},{"id":"歷48","subject":"歷史","chapter":"國家與社會","type":"題組1-2","question":"【承上題】若數代後諸侯勢力壯大，不再服從周天子，這項制度最可能產生哪一弊端？","options":["地方勢力坐大，中央權威衰落","中央任命過於頻繁","考試競爭過度","行政命令缺乏法律授權"],"answer":0,"explanation":"封建諸侯具有土地、人民與軍力，可能逐漸威脅中央。","key":"數代、諸侯壯大、不服從","trap":"承接前題時要從制度優點轉看長期風險。"},{"id":"歷49","subject":"歷史","chapter":"國家與社會","type":"題組2-1","question":"【題組】甲出身漢代地方望族，因孝順廉潔被太守推薦；乙生於魏晉寒門，才華出眾卻因門第被評為下品；丙在唐代研讀經典後參加考試。甲最可能透過何種制度入仕？","options":["察舉制度","九品官人之法","科舉制度","封建制度"],"answer":0,"explanation":"漢代地方官推薦孝廉，屬察舉制度。","key":"漢代、太守推薦、孝廉","trap":"不要被望族身分干擾，關鍵是推薦。"},{"id":"歷50","subject":"歷史","chapter":"國家與社會","type":"題組2-2","question":"【承上題】乙的遭遇最能反映哪一歷史現象？","options":["九品官人法後期重門第，寒門受限","察舉完全以考試取才","科舉只准世族參加","封建制度保障平民"],"answer":0,"explanation":"魏晉九品官人法後期形成上品無寒門、下品無世族。","key":"魏晉、寒門、下品","trap":"制度初衷與後期實際運作可能不同。"},{"id":"歷51","subject":"歷史","chapter":"國家與社會","type":"題組2-3","question":"【承上題】丙所處制度與乙相比，最重要的差異是什麼？","options":["以考試表現為主要選才依據，較能突破門第限制","官位改由血緣世襲","地方官可自行稱王","完全不需讀書準備"],"answer":0,"explanation":"科舉以考試取才，提供非世族讀書人較多入仕機會。","key":"唐代、研讀、考試","trap":"較能突破不等於完全消除社會不平等。"},{"id":"歷52","subject":"歷史","chapter":"民族與文化","type":"題組3-1","question":"【題組】某商隊從長安向西行，攜帶絲綢與漆器；返程時帶回葡萄、香料與樂器。這趟旅程最可能利用哪一交流網絡？","options":["絲綢之路","京杭大運河","海上新航路","萬里長城防線"],"answer":0,"explanation":"長安向西連結中亞的陸上交通網絡即絲路。","key":"長安、向西、葡萄、絲綢","trap":"絲路由多段路線組成，不是一條固定道路。"},{"id":"歷53","subject":"歷史","chapter":"民族與文化","type":"題組3-2","question":"【承上題】材料反映的文化交流特色為何？","options":["商品與文化具有雙向流動","只有中國商品向外輸出","交流只限官方使節","戰爭完全阻止交流"],"answer":0,"explanation":"去程與返程帶不同物品，顯示物產與文化雙向交換。","key":"去程、返程、不同物品","trap":"不要將絲路簡化成絲綢單向外銷。"},{"id":"歷54","subject":"歷史","chapter":"民族與文化","type":"題組4-1","question":"【題組】北魏朝廷規定官員在朝廷說漢語、改用漢姓，並鼓勵與漢人通婚。這組政策的直接目標為何？","options":["減少族群隔閡並鞏固統治","恢復草原游牧制度","切斷南北交通","建立海上貿易霸權"],"answer":0,"explanation":"孝文帝漢化政策藉文化與婚姻整合政權。","key":"漢語、漢姓、通婚","trap":"政策目標是統治整合，不只是文化喜好。"},{"id":"歷55","subject":"歷史","chapter":"民族與文化","type":"題組4-2","question":"【承上題】從長期角度看，這些政策最可能促進哪一現象？","options":["胡漢文化交流與民族融合","世族制度立即消失","佛教完全退出中國","東亞文化圈瓦解"],"answer":0,"explanation":"語言、姓氏與婚姻互動會促進長期民族融合。","key":"長期、文化交流、融合","trap":"融合不等於所有差異立即消失。"},{"id":"歷56","subject":"歷史","chapter":"國家與社會","type":"跨時代題","question":"某老師以「西周諸侯、秦代郡守、漢代孝廉、魏晉中正官、唐代進士」製作時間軸。這條時間軸最能呈現哪兩項長期轉變？","options":["地方治理由分封走向中央任命，選才由身分推薦走向考試","中央權力逐步消失，官位全面世襲","宗教取代政治制度，商業取代農業","地方自治持續擴大，考試逐步取消"],"answer":0,"explanation":"諸侯到郡守反映地方控制，孝廉到进士反映選才制度演變。","key":"諸侯、郡守、孝廉、中正官、進士","trap":"要同時解讀兩條制度線索。"},{"id":"歷57","subject":"歷史","chapter":"國家與社會","type":"素養題","question":"某學生說：「秦始皇統一貨幣，所以所有地方差異立刻消失。」對此最適當的評析為何？","options":["標準化有助交流與治理，但地方文化差異不會立即消失","說法完全正確","統一貨幣只影響宗教","貨幣政策會使封建制度恢復"],"answer":0,"explanation":"經濟標準化能降低交易成本，但不能直接消除所有社會文化差異。","key":"立刻、所有差異","trap":"注意題幹中的絕對化語詞。"},{"id":"歷58","subject":"歷史","chapter":"民族與文化","type":"素養題","question":"某學生認為：「民族融合就是其中一方放棄全部文化。」下列何者最適合修正這個觀點？","options":["民族融合通常是長期互動、彼此吸收與重新組合","融合只靠戰爭完成","融合後所有人生活完全相同","融合與遷徙、通婚無關"],"answer":0,"explanation":"民族融合是多向互動，可能保留差異並形成新文化。","key":"全部、彼此吸收","trap":"看到「完全、必然、只有」要特別檢查。"},{"id":"歷59","subject":"歷史","chapter":"國家與社會","type":"史料題","question":"史書記載：「上品無寒門，下品無世族。」此語最適合用來批評哪一制度的實際弊端？","options":["九品官人之法","西周封建","秦代郡縣","隋唐科舉"],"answer":0,"explanation":"此語指出九品制度後期被世族把持，品第與門第密切相關。","key":"上品、寒門、世族","trap":"科舉反而是削弱此現象的重要制度。"},{"id":"歷60","subject":"歷史","chapter":"民族與文化","type":"史料題","question":"唐代文獻記載：「天下稱唐皇為天可汗。」這段記載最能反映唐初哪一特色？","options":["以較開放方式處理民族關係並建立威望","完全取消國內行政制度","只以武力禁止交流","唐朝直接統治所有亞洲地區"],"answer":0,"explanation":"天可汗稱號反映唐太宗獲部分西北民族認同。","key":"天可汗、唐初、民族","trap":"稱號代表政治威望，不等於全面直接統治。"},{"id":"歷61","subject":"歷史","chapter":"大唐風情","type":"因果題","question":"唐代長安流行西域音樂、舞蹈與飲食，外國商人也能在市坊生活。這種文化景象形成的條件最不可能包括哪一項？","options":["全面禁止外國人入境與民間交易","陸上與海上交通發達","帝國國力與都市市場繁榮","政策相對包容外來文化"],"answer":0,"explanation":"全面禁止交流會阻止題幹描述的現象。","key":"最不可能、全面禁止","trap":"否定題要先圈出「不」。"},{"id":"歷62","subject":"歷史","chapter":"國家與社會","type":"圖表題","question":"某表格比較三制度：甲由地方官推薦孝廉；乙由中正官評定品級；丙由中央舉行考試。甲、乙、丙依序為何？","options":["察舉、九品官人法、科舉","科舉、察舉、九品官人法","九品官人法、科舉、察舉","察舉、科舉、封建"],"answer":0,"explanation":"推薦孝廉、評品與考試分別對應三種選才制度。","key":"推薦孝廉、中正官、中央考試","trap":"制度名稱相近時要抓運作方式。"},{"id":"歷63","subject":"歷史","chapter":"民族與文化","type":"排序題","question":"依歷史先後排列：甲、張騫通西域；乙、北魏孝文帝漢化；丙、文成公主入藏；丁、怛羅斯之役。","options":["甲→乙→丙→丁","乙→甲→丁→丙","甲→丙→乙→丁","乙→丁→甲→丙"],"answer":0,"explanation":"張騫在西漢，孝文帝在北魏，文成公主與怛羅斯之役皆在唐代且文成公主較早。","key":"西漢、北魏、唐初、唐中期","trap":"先判朝代，再排同朝事件。"},{"id":"歷64","subject":"歷史","chapter":"國家與社會","type":"跨章題","question":"商鞅變法的編戶齊民、秦代郡縣制與隋唐科舉，看似分屬不同時代，卻都可與哪一統治趨勢連結？","options":["國家逐步直接掌握人民、地方與官僚","地方世襲權力不斷擴張","血緣成為唯一政治基礎","中央逐步放棄選才"],"answer":0,"explanation":"三者分別加強人口控制、地方控制與官僚控制。","key":"人民、地方、官僚","trap":"跨章題要找共同政治功能。"},{"id":"歷65","subject":"歷史","chapter":"民族與文化","type":"史料判讀","question":"史料稱某城市「萬國衣冠拜冕旒」，街市可見各地商旅與不同語言。若史料描述可信，最能證明什麼？","options":["唐代都城具國際交流中心特色","唐代所有人民都是外國人","唐朝已統一全世界","都城沒有本地居民"],"answer":0,"explanation":"外國使節、商旅與多語環境支持國際城市判斷。","key":"萬國、商旅、不同語言","trap":"誇飾文字需配合其他資料，不可無限解讀。"},{"id":"歷66","subject":"歷史","chapter":"國家與社會","type":"評析題","question":"有人說：「科舉出現後，家世與財富便完全不再影響仕途。」下列評析何者最好？","options":["科舉擴大選才機會，但教育資源與家庭條件仍會影響應試","完全正確，社會從此絕對平等","完全錯誤，科舉只准世族參加","科舉與選官無關"],"answer":0,"explanation":"科舉以考試為主，確實弱化門第，但不代表消除所有不平等。","key":"完全、不再","trap":"對絕對化敘述要保留條件。"},{"id":"歷67","subject":"歷史","chapter":"民族與文化","type":"評析題","question":"有人把絲路想成一條由長安直達羅馬、全程由同一商人走完的道路。這個想法最需要修正之處為何？","options":["絲路是多條路線與多段轉運構成的交流網絡","絲路完全沒有商人","絲路只在海上","絲路只運送宗教"],"answer":0,"explanation":"絲路由不同地區商旅接力，形成陸海相連的網絡。","key":"一條直達、同一商人","trap":"名稱中的「路」不代表單一固定道路。"},{"id":"歷68","subject":"歷史","chapter":"國家與社會","type":"應用題","question":"若你是戰國小國改革者，目標是增加兵源與稅收，最可能優先推動哪項措施？","options":["建立戶籍並直接向人民徵兵徵稅","恢復諸侯層層分封","取消土地登記","讓貴族自行保留全部賦稅"],"answer":0,"explanation":"戶籍可讓國家掌握人口、土地與資源。","key":"兵源、稅收、戶籍","trap":"題目問施政工具，要連結其行政功能。"},{"id":"歷69","subject":"歷史","chapter":"民族與文化","type":"應用題","question":"若考古隊在唐代墓葬發現波斯風格銀器、中亞樂器與漢字墓誌，最合理的研究結論是什麼？","options":["唐代社會存在跨文化交流與融合","墓主人必定是外國皇帝","唐代沒有本土文化","所有物品都在同一地製造"],"answer":0,"explanation":"不同文化元素同時出現，支持交流與融合，但不能直接確定墓主人身分。","key":"波斯銀器、中亞樂器、漢字","trap":"文物能支持交流，不一定能證明個人身分。"},{"id":"歷70","subject":"歷史","chapter":"國家與社會","type":"比較題","question":"西周封建與秦朝郡縣都要治理地方，但兩者權力來源有何根本不同？","options":["諸侯多依血緣功勳受封，郡縣官由中央任免","兩者地方官都由考試選出","兩者官位都不可更換","兩者都完全不受中央控制"],"answer":0,"explanation":"封建具世襲性，郡縣官僚則受中央任免與調動。","key":"受封、任免","trap":"重點不是有沒有地方單位，而是權力來源。"}],$=x=>document.getElementById(x);let E=[];function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function p(s,n){return sh(B.filter(x=>x.subject===s)).slice(0,n)}$('s').onclick=()=>{if(!$('n').value.trim())return;E=sh([...p('地理',18),...p('歷史',17),...p('公民',15)]);$('q').innerHTML=E.map((x,i)=>`<section class=q><b>${x.subject}｜${x.type||'基礎題'}</b><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class=opt><input type=radio name=q${i} value=${k}> ${o}</label>`).join('')}</section>`).join('');$('sub').disabled=false};$('sub').onclick=()=>{let c=0,w=[];E.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);a=a?+a.value:null;if(a===x.answer)c++;else w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer]})});$('res').innerHTML=`<section class=panel><h2>${c*2}分</h2></section>`;localStorage.setItem('social_wrongbook',JSON.stringify(w));let h=JSON.parse(localStorage.getItem('social_scoreHistory')||'[]');h.unshift({name:$('n').value,score:c*2,date:new Date().toLocaleString()});localStorage.setItem('social_scoreHistory',JSON.stringify(h))};</script>
