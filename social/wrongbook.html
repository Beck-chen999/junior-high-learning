<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社會科錯題本</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:38px 18px;color:#fff;text-align:center;background:linear-gradient(135deg,#263238,#455a64,#78909c)}header h1{margin:0;font-size:38px}nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:11px;background:#fff;box-shadow:0 2px 8px #0002}nav a,.btn{display:inline-block;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700}nav a{color:#37474f;background:#eceff1}.wrap{max-width:1150px;margin:auto;padding:24px 15px}.panel,.card,.q{background:#fff;border-radius:14px;box-shadow:0 3px 12px #0001;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{display:flex;flex-direction:column;border-top:6px solid var(--c,#546e7a);min-height:255px}.card p{flex:1;color:#546e7a}.btn{color:#fff;background:var(--c,#455a64);align-self:flex-start}.tag{display:inline-block;background:#e8f5e9;color:#2e7d32;padding:3px 9px;border-radius:20px;font-size:14px;font-weight:700}.note{border-left:6px solid #ffb300;background:#fff8e1;padding:15px;border-radius:8px}.key{border-left:6px solid #43a047;background:#e8f5e9;padding:15px;border-radius:8px}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{padding:11px;font:inherit;border:2px solid #b0bec5;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#00695c;color:#fff;font-weight:700;cursor:pointer}button:disabled{background:#b0bec5}.wrong{border-left:6px solid #e53935;background:#ffebee;padding:14px;margin:12px 0;border-radius:8px}footer{text-align:center;padding:24px;background:#263238;color:#fff}@media(max-width:600px){header h1{font-size:28px}nav{position:static}.wrap{padding:12px 8px}.panel,.card,.q{padding:16px}.toolbar input,.toolbar button{width:100%}}</style></head><body><header><h1>社會科錯題本</h1><p>翰林版｜八年級上學期｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">一段總複習</a><a href="quiz_exam1_50.html">50題模擬考</a><a href="wrongbook.html">錯題本</a><a href="score.html">歷史成績</a></nav><main class="wrap"><section class="panel"><h2>社會科錯題本</h2><div class="toolbar"><button onclick="render()">重新整理</button><button onclick="clearAll()">清空錯題</button></div></section><div id="list"></div><script>function render(){let a=JSON.parse(localStorage.getItem('social_wrongbook')||'[]');document.getElementById('list').innerHTML=a.length?a.map((x,i)=>`<section class="wrong"><span class="tag">${x.subject}</span><h3>${x.question}</h3><p>你的答案：${x.userAnswer}</p><p>正確答案：${x.correctAnswer}</p><p>解析：${x.explanation}</p><p>解題關鍵：${x.key}</p><p>易錯提醒：${x.trap}</p><button onclick="del(${i})">刪除此題</button></section>`).join(''):'<section class="panel">目前沒有錯題。</section>'}function del(i){let a=JSON.parse(localStorage.getItem('social_wrongbook')||'[]');a.splice(i,1);localStorage.setItem('social_wrongbook',JSON.stringify(a));render()}function clearAll(){if(confirm('確定清空？')){localStorage.removeItem('social_wrongbook');render()}}render();</script></main><footer>JOSH 勛 社會科搶救大作戰</footer></body></html>
