<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社會科錯題重做</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:#455a64;color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff}nav a,.btn{padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:bold}nav a{background:#eceff1;color:#37474f}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.card,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{display:flex;flex-direction:column;min-height:220px;border-top:6px solid var(--c,#546e7a)}.card p{flex:1}.btn,button{background:#00695c;color:#fff;border:0;cursor:pointer}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.opt{display:block;padding:9px;margin:7px 0;border:1px solid #ccc;border-radius:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,button{padding:10px;font:inherit;border-radius:7px}footer{padding:20px;text-align:center;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}.toolbar input,.toolbar button{width:100%}}.stat{padding:16px;border-radius:12px;background:#fff;box-shadow:0 2px 10px #0001}.bar{height:13px;background:#eceff1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00897b}.weak{border-left:6px solid #ef6c00}.mastered{border-left:6px solid #43a047}.wrong{border-left:6px solid #e53935}.answer-detail{margin-top:12px;padding:14px;background:#f5f7fa;border-radius:8px}.muted{color:#607d8b}</style></head><body><header><h1>社會科錯題重做</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a><a href="score.html">成績</a></nav><main class="wrap"><section class="panel"><h2>錯題重做中心</h2><p>每題需連續答對2次才會從錯題本移除。可依科目篩選，也可重做全部錯題。</p><div class="toolbar"><select id="filter"><option value="全部">全部科目</option><option>地理</option><option>歷史</option><option>公民</option></select><select id="count"><option value="10">抽10題</option><option value="20">抽20題</option><option value="999">全部錯題</option></select><button id="begin">開始重做</button><button id="clear">清空錯題</button></div></section><section class="panel"><div id="summary"></div></section><div id="review"></div><button id="submitReview" style="display:none">提交重做</button><div id="reviewResult"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>'use strict';const $=x=>document.getElementById(x);let review=[];function read(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function drawSummary(){const w=read('social_wrongbook'),m=w.filter(x=>x.successCount===1).length;summary.innerHTML=`目前錯題：<b>${w.length}</b>題｜已答對1次、待確認掌握：<b>${m}</b>題｜地理 ${w.filter(x=>x.subject==='地理').length}｜歷史 ${w.filter(x=>x.subject==='歷史').length}｜公民 ${w.filter(x=>x.subject==='公民').length}`}drawSummary();begin.onclick=()=>{let w=read('social_wrongbook'),f=filter.value;if(f!=='全部')w=w.filter(x=>x.subject===f);review=sh(w).slice(0,+count.value).map(x=>{x={...x,options:[...x.options]};const correct=x.correctAnswer||x.options[x.answer];x.options=sh(x.options);x.answer=x.options.indexOf(correct);return x});if(!review.length){reviewResult.innerHTML='<section class="panel key">目前沒有符合條件的錯題。</section>';return}reviewResult.innerHTML='';review.innerHTML='';document.getElementById('review').innerHTML=review.map((x,i)=>`<section class="q"><span class="tag">${x.subject}｜${x.type||'綜合題'}</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class="opt"><input type="radio" name="r${i}" value="${k}"> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('');submitReview.style.display='inline-block'};submitReview.onclick=()=>{let w=read('social_wrongbook'),correct=0;review.forEach((x,i)=>{const e=document.querySelector(`input[name=r${i}]:checked`),a=e?+e.value:null,ok=a===x.answer,key=x.baseKey||x.id,idx=w.findIndex(y=>(y.baseKey||y.id)===key);if(ok){correct++;if(idx>=0){w[idx].successCount=(w[idx].successCount||0)+1;w[idx].lastCorrect=true;if(w[idx].successCount>=2)w.splice(idx,1)}}else if(idx>=0){w[idx].successCount=0;w[idx].lastCorrect=false;w[idx].userAnswer=a===null?'未作答':x.options[a]}});localStorage.setItem('social_wrongbook',JSON.stringify(w));let h=read('social_scoreHistory');h.unshift({mode:'錯題重做',name:localStorage.getItem('social_currentStudentName')||'',score:Math.round(correct/review.length*100),correct,total:review.length,date:new Date().toLocaleString('zh-TW')});localStorage.setItem('social_scoreHistory',JSON.stringify(h));reviewResult.innerHTML=`<section class="panel ${correct===review.length?'mastered':'weak'}"><h2>重做答對 ${correct}/${review.length}</h2><p>連續答對2次的題目已從錯題本移除。</p><a class="btn" href="analysis.html">查看分析</a></section>`;document.getElementById('review').innerHTML='';submitReview.style.display='none';drawSummary()};clear.onclick=()=>{if(confirm('確定清空所有錯題？')){localStorage.removeItem('social_wrongbook');drawSummary();document.getElementById('review').innerHTML=''}};</script></body></html>
