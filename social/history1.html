<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歷史第1章｜國家與社會</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:linear-gradient(135deg,#37474f,#607d8b);color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}nav a{background:#eceff1;color:#37474f}.btn,button{background:#00695c;color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}.panel,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.wrong{border-left:6px solid #e53935}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.answer{padding:13px;background:#f5f7fa;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:20px;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}button{width:100%}}</style></head><body><header><h1>歷史第1章｜國家與社會</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">50題模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a></nav><main class="wrap"><section class="panel"><h2>章節學習重點</h2><p>先閱讀本章核心說明，再完成頁面下方10題理解檢核。達到80分以上表示基本掌握；未滿80分建議返回重點複習後再測一次。</p></section><section class="panel"><h2>1. 西周治理廣土採何制度？</h2><p>分封宗室功臣協助治理。</p></section><section class="panel"><h2>2. 嫡長子繼承屬何制度？</h2><p>宗法以血緣維持貴族秩序。</p></section><section class="panel"><h2>3. 戰國使秦國富強者？</h2><p>商鞅變法獎勵耕戰並推行軍功爵。</p></section><section class="panel"><h2>4. 秦朝地方制度？</h2><p>地方官由中央任免。</p></section><section class="panel"><h2>5. 秦統一標準的效果？</h2><p>文字貨幣度量衡統一降低交流成本。</p></section><section class="panel"><h2>本章10題理解檢核</h2><div class="toolbar"><button id="start">開始作答</button><button id="retry">重新測驗</button></div><p id="status">尚未開始</p></section><div id="quiz"></div><button id="submit" style="display:none">提交本章測驗</button><div id="result"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>const Q=[{"id":"history1.html-1","question":"西周治理廣土採何制度？","options":["封建制度","郡縣制度","科舉制度","察舉制度"],"answer":0,"explanation":"分封宗室功臣協助治理。"},{"id":"history1.html-2","question":"嫡長子繼承屬何制度？","options":["宗法制度","郡縣制度","科舉制度","軍功爵制"],"answer":0,"explanation":"宗法以血緣維持貴族秩序。"},{"id":"history1.html-3","question":"戰國使秦國富強者？","options":["商鞅","張騫","孝文帝","董仲舒"],"answer":0,"explanation":"商鞅變法獎勵耕戰並推行軍功爵。"},{"id":"history1.html-4","question":"秦朝地方制度？","options":["郡縣制度","封建制度","察舉","九品官人"],"answer":0,"explanation":"地方官由中央任免。"},{"id":"history1.html-5","question":"秦統一標準的效果？","options":["便利交流與帝國治理","恢復割據","增加貨幣種類","強化世族"],"answer":0,"explanation":"文字貨幣度量衡統一降低交流成本。"},{"id":"history1.html-6","question":"漢代地方推薦孝廉屬？","options":["察舉制度","科舉","九品官人","封建"],"answer":0,"explanation":"察舉以地方官推薦為主。"},{"id":"history1.html-7","question":"魏晉重門第的選才？","options":["九品官人之法","察舉","科舉","郡縣"],"answer":0,"explanation":"後期形成上品無寒門。"},{"id":"history1.html-8","question":"隋唐主要選才制度？","options":["科舉制度","察舉","封建","宗法"],"answer":0,"explanation":"以考試選才，削弱世族壟斷。"},{"id":"history1.html-9","question":"春秋與戰國主要差異？","options":["春秋爭霸、戰國兼併","春秋科舉、戰國察舉","春秋中央集權、戰國封建","無差異"],"answer":0,"explanation":"戰國競爭更激烈並走向統一。"},{"id":"history1.html-10","question":"封建到郡縣的趨勢？","options":["中央加強地方控制","地方世襲增強","中央放棄治理","血緣成為唯一標準"],"answer":0,"explanation":"郡縣官由中央任免。"}],$=x=>document.getElementById(x);let E=[];function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){E=sh(Q).map(x=>{x={...x,options:[...x.options]};let c=x.options[x.answer];x.options=sh(x.options);x.answer=x.options.indexOf(c);return x});quiz.innerHTML=E.map((x,i)=>`<section class=q><span class=tag>本章檢核</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class=opt><input type=radio name=c${i} value=${k}> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('');status.textContent='共10題，每題10分';submit.style.display='inline-block';result.innerHTML=''}start.onclick=render;retry.onclick=render;submit.onclick=()=>{let c=0,w=[];E.forEach((x,i)=>{let e=document.querySelector(`input[name=c${i}]:checked`),a=e?+e.value:null;if(a===x.answer)c++;else w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],subject:'歷史第1章',chapter:'歷史第1章｜國家與社會',baseKey:x.id,successCount:0})});let score=c*10;result.innerHTML=`<section class="panel ${score>=80?'key':'note'}"><h2>${score}分｜答對 ${c}/10</h2><p>${score>=80?'本章基本概念已掌握。':'建議重新閱讀本章重點後再測一次。'}</p></section>`+w.map((x,i)=>`<section class="panel wrong"><h3>錯題 ${i+1}｜${x.question}</h3><p><b>你的答案：</b>${x.userAnswer}</p><p><b>正確答案：</b>${x.correctAnswer}</p><div class=answer><b>解析：</b>${x.explanation}</div></section>`).join('');let wb=[];try{wb=JSON.parse(localStorage.getItem('social_wrongbook')||'[]')}catch(e){}w.forEach(x=>{let i=wb.findIndex(y=>(y.baseKey||y.id)===x.baseKey);i>=0?wb[i]=x:wb.push(x)});localStorage.setItem('social_wrongbook',JSON.stringify(wb));let h=[];try{h=JSON.parse(localStorage.getItem('social_scoreHistory')||'[]')}catch(e){}h.unshift({mode:'章節測驗',name:localStorage.getItem('social_currentStudentName')||'',chapter:'歷史第1章｜國家與社會',score,correct:c,total:10,date:new Date().toLocaleString('zh-TW')});localStorage.setItem('social_scoreHistory',JSON.stringify(h));window.scrollTo({top:result.offsetTop,behavior:'smooth'})};</script></body></html>
