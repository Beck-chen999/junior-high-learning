<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歷史探查｜大唐風情</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:linear-gradient(135deg,#37474f,#607d8b);color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}nav a{background:#eceff1;color:#37474f}.btn,button{background:#00695c;color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}.panel,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.wrong{border-left:6px solid #e53935}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.answer{padding:13px;background:#f5f7fa;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:20px;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}button{width:100%}}</style></head><body><header><h1>歷史探查｜大唐風情</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">50題模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a></nav><main class="wrap"><section class="panel"><h2>章節學習重點</h2><p>先閱讀本章核心說明，再完成頁面下方10題理解檢核。達到80分以上表示基本掌握；未滿80分建議返回重點複習後再測一次。</p></section><section class="panel"><h2>1. 長安國際性的證據？</h2><p>人員商品與思想跨區流動。</p></section><section class="panel"><h2>2. 胡餅胡服胡樂反映？</h2><p>唐人生活吸收外來文化。</p></section><section class="panel"><h2>3. 唐代多元宗教與何者最相關？</h2><p>商路帶來不同信仰。</p></section><section class="panel"><h2>4. 判斷史實最好方法？</h2><p>文物文獻互證較可靠。</p></section><section class="panel"><h2>5. 日本學習唐文化特色？</h2><p>文化接受者會調整外來制度。</p></section><section class="panel"><h2>本章10題理解檢核</h2><div class="toolbar"><button id="start">開始作答</button><button id="retry">重新測驗</button></div><p id="status">尚未開始</p></section><div id="quiz"></div><button id="submit" style="display:none">提交本章測驗</button><div id="result"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>const Q=[{"id":"history-explore1.html-1","question":"長安國際性的證據？","options":["外國商旅使節與多元文化","只有本地居民","禁止外國宗教","取消市場"],"answer":0,"explanation":"人員商品與思想跨區流動。"},{"id":"history-explore1.html-2","question":"胡餅胡服胡樂反映？","options":["西域文化影響","閉關政策","科舉制度","郡縣制度"],"answer":0,"explanation":"唐人生活吸收外來文化。"},{"id":"history-explore1.html-3","question":"唐代多元宗教與何者最相關？","options":["交通交流與政策包容","完全禁止商旅","單一信仰","人口稀少"],"answer":0,"explanation":"商路帶來不同信仰。"},{"id":"history-explore1.html-4","question":"判斷史實最好方法？","options":["多種同時期史料交叉驗證","只看電視劇","只看小說","只聽傳說"],"answer":0,"explanation":"文物文獻互證較可靠。"},{"id":"history-explore1.html-5","question":"日本學習唐文化特色？","options":["選擇吸收並在地化","完全照抄","消滅本土文化","只學飲食"],"answer":0,"explanation":"文化接受者會調整外來制度。"},{"id":"history-explore1.html-6","question":"東亞文化圈不代表？","options":["政治上由同一國統治","共享漢字","受儒佛影響","制度交流"],"answer":0,"explanation":"文化共通不等於政治統一。"},{"id":"history-explore1.html-7","question":"胡旋舞與琵琶多來自？","options":["西域文化","北美文化","南極文化","西歐工業文化"],"answer":0,"explanation":"反映唐代西域交流。"},{"id":"history-explore1.html-8","question":"外國留學生來唐主要目的？","options":["學習制度與文化","建立封建諸侯","廢除文字","禁止佛教"],"answer":0,"explanation":"唐代是東亞文化中心。"},{"id":"history-explore1.html-9","question":"長安繁榮的重要條件？","options":["國力、交通與開放政策","全面禁商","只有農業","無外國人"],"answer":0,"explanation":"多重條件促進交流。"},{"id":"history-explore1.html-10","question":"墓葬見波斯銀器可推論？","options":["存在跨文化交流","墓主必為皇帝","唐統治歐洲","器物必為本地製"],"answer":0,"explanation":"文物支持交流但不能無限推論。"}],$=x=>document.getElementById(x);let E=[];function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){E=sh(Q).map(x=>{x={...x,options:[...x.options]};let c=x.options[x.answer];x.options=sh(x.options);x.answer=x.options.indexOf(c);return x});quiz.innerHTML=E.map((x,i)=>`<section class=q><span class=tag>本章檢核</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class=opt><input type=radio name=c${i} value=${k}> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('');status.textContent='共10題，每題10分';submit.style.display='inline-block';result.innerHTML=''}start.onclick=render;retry.onclick=render;submit.onclick=()=>{let c=0,w=[];E.forEach((x,i)=>{let e=document.querySelector(`input[name=c${i}]:checked`),a=e?+e.value:null;if(a===x.answer)c++;else w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],subject:'歷史探查',chapter:'歷史探查｜大唐風情',baseKey:x.id,successCount:0})});let score=c*10;result.innerHTML=`<section class="panel ${score>=80?'key':'note'}"><h2>${score}分｜答對 ${c}/10</h2><p>${score>=80?'本章基本概念已掌握。':'建議重新閱讀本章重點後再測一次。'}</p></section>`+w.map((x,i)=>`<section class="panel wrong"><h3>錯題 ${i+1}｜${x.question}</h3><p><b>你的答案：</b>${x.userAnswer}</p><p><b>正確答案：</b>${x.correctAnswer}</p><div class=answer><b>解析：</b>${x.explanation}</div></section>`).join('');let wb=[];try{wb=JSON.parse(localStorage.getItem('social_wrongbook')||'[]')}catch(e){}w.forEach(x=>{let i=wb.findIndex(y=>(y.baseKey||y.id)===x.baseKey);i>=0?wb[i]=x:wb.push(x)});localStorage.setItem('social_wrongbook',JSON.stringify(wb));let h=[];try{h=JSON.parse(localStorage.getItem('social_scoreHistory')||'[]')}catch(e){}h.unshift({mode:'章節測驗',name:localStorage.getItem('social_currentStudentName')||'',chapter:'歷史探查｜大唐風情',score,correct:c,total:10,date:new Date().toLocaleString('zh-TW')});localStorage.setItem('social_scoreHistory',JSON.stringify(h));window.scrollTo({top:result.offsetTop,behavior:'smooth'})};</script></body></html>
