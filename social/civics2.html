<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公民第2章｜憲法與權利保障</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.75}header{padding:35px 15px;text-align:center;background:linear-gradient(135deg,#37474f,#607d8b);color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}nav a{background:#eceff1;color:#37474f}.btn,button{background:#00695c;color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}.panel,.q{background:#fff;padding:21px;margin-bottom:18px;border-radius:13px;box-shadow:0 2px 10px #0001}.tag{display:inline-block;padding:3px 9px;background:#e8f5e9;color:#2e7d32;border-radius:18px}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.wrong{border-left:6px solid #e53935}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.answer{padding:13px;background:#f5f7fa;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;padding:20px;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}button{width:100%}}</style></head><body><header><h1>公民第2章｜憲法與權利保障</h1><p>翰林版八年級上｜第一次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam1.html">總複習</a><a href="quiz_exam1_50.html">50題模擬考</a><a href="wrongbook.html">錯題重做</a><a href="analysis.html">學習分析</a></nav><main class="wrap"><section class="panel"><h2>章節學習重點</h2><p>先閱讀本章核心說明，再完成頁面下方10題理解檢核。達到80分以上表示基本掌握；未滿80分建議返回重點複習後再測一次。</p></section><section class="panel"><h2>1. 法規位階由高至低？</h2><p>低位階不得牴觸高位階。</p></section><section class="panel"><h2>2. 法律牴觸憲法顯示？</h2><p>憲法具有最高效力。</p></section><section class="panel"><h2>3. 修憲程序嚴格顯示？</h2><p>憲法不易隨意修改。</p></section><section class="panel"><h2>4. 憲法只定根本原則顯示？</h2><p>細節另由法律規範。</p></section><section class="panel"><h2>5. 無合理理由差別待遇侵害？</h2><p>平等禁止不合理差別。</p></section><section class="panel"><h2>本章10題理解檢核</h2><div class="toolbar"><button id="start">開始作答</button><button id="retry">重新測驗</button></div><p id="status">尚未開始</p></section><div id="quiz"></div><button id="submit" style="display:none">提交本章測驗</button><div id="result"></div></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>const Q=[{"id":"civics2.html-1","question":"法規位階由高至低？","options":["憲法、法律、命令","法律、憲法、命令","命令、法律、憲法","憲法、命令、法律"],"answer":0,"explanation":"低位階不得牴觸高位階。"},{"id":"civics2.html-2","question":"法律牴觸憲法顯示？","options":["憲法最高性","固定性","原則性","責任性"],"answer":0,"explanation":"憲法具有最高效力。"},{"id":"civics2.html-3","question":"修憲程序嚴格顯示？","options":["固定性","最高性","原則性","政黨性"],"answer":0,"explanation":"憲法不易隨意修改。"},{"id":"civics2.html-4","question":"憲法只定根本原則顯示？","options":["原則性","固定性","最高性","自由性"],"answer":0,"explanation":"細節另由法律規範。"},{"id":"civics2.html-5","question":"無合理理由差別待遇侵害？","options":["平等權","參政權","訴訟權","財產權"],"answer":0,"explanation":"平等禁止不合理差別。"},{"id":"civics2.html-6","question":"限制發表意見涉及？","options":["言論自由","選舉權","受教育權","生存權"],"answer":0,"explanation":"發表公共意見屬言論自由。"},{"id":"civics2.html-7","question":"不服罰鍰向上級機關救濟？","options":["訴願","請願","訴訟","複決"],"answer":0,"explanation":"訴願針對行政處分。"},{"id":"civics2.html-8","question":"向法院請求裁判？","options":["訴訟權","選舉權","請願權","罷免權"],"answer":0,"explanation":"法院裁判屬訴訟。"},{"id":"civics2.html-9","question":"投票選民代屬？","options":["參政權","自由權","平等權","財產權"],"answer":0,"explanation":"選舉是參政權。"},{"id":"civics2.html-10","question":"限制基本權應符合？","options":["法律依據與比例原則","政府宣布即可","多數同意即可","完全不得限制"],"answer":0,"explanation":"限制須依法且不得過度。"}],$=x=>document.getElementById(x);let E=[];function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){E=sh(Q).map(x=>{x={...x,options:[...x.options]};let c=x.options[x.answer];x.options=sh(x.options);x.answer=x.options.indexOf(c);return x});quiz.innerHTML=E.map((x,i)=>`<section class=q><span class=tag>本章檢核</span><h3>${i+1}. ${x.question}</h3>${x.options.map((o,k)=>`<label class=opt><input type=radio name=c${i} value=${k}> ${String.fromCharCode(65+k)}. ${o}</label>`).join('')}</section>`).join('');status.textContent='共10題，每題10分';submit.style.display='inline-block';result.innerHTML=''}start.onclick=render;retry.onclick=render;submit.onclick=()=>{let c=0,w=[];E.forEach((x,i)=>{let e=document.querySelector(`input[name=c${i}]:checked`),a=e?+e.value:null;if(a===x.answer)c++;else w.push({...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],subject:'公民第2章',chapter:'公民第2章｜憲法與權利保障',baseKey:x.id,successCount:0})});let score=c*10;result.innerHTML=`<section class="panel ${score>=80?'key':'note'}"><h2>${score}分｜答對 ${c}/10</h2><p>${score>=80?'本章基本概念已掌握。':'建議重新閱讀本章重點後再測一次。'}</p></section>`+w.map((x,i)=>`<section class="panel wrong"><h3>錯題 ${i+1}｜${x.question}</h3><p><b>你的答案：</b>${x.userAnswer}</p><p><b>正確答案：</b>${x.correctAnswer}</p><div class=answer><b>解析：</b>${x.explanation}</div></section>`).join('');let wb=[];try{wb=JSON.parse(localStorage.getItem('social_wrongbook')||'[]')}catch(e){}w.forEach(x=>{let i=wb.findIndex(y=>(y.baseKey||y.id)===x.baseKey);i>=0?wb[i]=x:wb.push(x)});localStorage.setItem('social_wrongbook',JSON.stringify(wb));let h=[];try{h=JSON.parse(localStorage.getItem('social_scoreHistory')||'[]')}catch(e){}h.unshift({mode:'章節測驗',name:localStorage.getItem('social_currentStudentName')||'',chapter:'公民第2章｜憲法與權利保障',score,correct:c,total:10,date:new Date().toLocaleString('zh-TW')});localStorage.setItem('social_scoreHistory',JSON.stringify(h));window.scrollTo({top:result.offsetTop,behavior:'smooth'})};</script></body></html>
