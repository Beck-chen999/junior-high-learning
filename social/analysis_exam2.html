<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二次段考學習分析</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#263238;font-family:"Microsoft JhengHei",sans-serif;line-height:1.72}header{padding:34px 16px;text-align:center;background:linear-gradient(135deg,#37474f,#607d8b);color:#fff}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}nav a,.btn,button{padding:9px 13px;border:0;border-radius:8px;text-decoration:none;font-weight:700;cursor:pointer}nav a{background:#eceff1;color:#37474f}.btn,button{background:#00695c;color:#fff}.wrap{max-width:1080px;margin:auto;padding:20px}.panel,.q,.card{background:#fff;padding:21px;margin-bottom:17px;border-radius:13px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{border-top:6px solid var(--c,#546e7a)}.tag,.core{display:inline-block;padding:3px 9px;border-radius:18px}.tag{background:#e8f5e9;color:#2e7d32}.core{background:#e3f2fd;color:#0d47a1;margin-left:5px;font-weight:700}.note{padding:14px;background:#fff8e1;border-left:5px solid #ffb300}.key{padding:14px;background:#e8f5e9;border-left:5px solid #43a047}.wrong{border-left:6px solid #e53935}.opt{display:block;padding:10px;margin:7px 0;border:1px solid #cfd8dc;border-radius:8px}.answer{padding:13px;background:#f5f7fa;border-radius:8px}.bar{height:13px;background:#eceff1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#00897b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#c62828}.stream1{--c:#546e7a}.stream2{--c:#00897b}footer{text-align:center;padding:20px;background:#263238;color:#fff}@media(max-width:600px){.wrap{padding:10px}button{width:100%}nav{position:static}}</style></head><body><header><h1>第二次段考學習分析</h1><p>翰林版八年級上｜第二次段考</p></header><nav><a href="../index.html">全科首頁</a><a href="index.html">社會首頁</a><a href="exam2.html">二段課程</a><a href="review_exam2.html">二段總複習</a><a href="quiz_exam2_50.html">二段模擬考</a><a href="wrongbook_exam2.html">二段錯題</a><a href="analysis_exam2.html">二段分析</a><a href="score_exam2.html">二段成績</a></nav><main class="wrap"><section class="panel"><h2>第二次段考學習分析</h2><div id="overview" class="grid"></div></section><section class="panel"><h2>分科正確率</h2><div id="subjects"></div></section><section class="panel"><h2>優先複習核心考點</h2><div id="weak"></div></section><button id="reset" class="danger">清除二段分析資料</button></main><footer>JOSH 勛 社會科搶救大作戰</footer><script>'use strict';const $=x=>document.getElementById(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function updateStats(x,ok){let s=read('social_exam2_questionStats',{}),k=x.baseKey||x.id,a=s[k]||{subject:x.subject,chapter:x.chapter,core:x.core,question:x.question,attempts:0,correct:0};a.attempts++;if(ok)a.correct++;a.lastCorrect=ok;s[k]=a;save('social_exam2_questionStats',s)}function recordWrong(x,a){let w=read('social_exam2_wrongbook',[]),k=x.baseKey||x.id,i=w.findIndex(y=>(y.baseKey||y.id)===k),r={...x,userAnswer:a===null?'未作答':x.options[a],correctAnswer:x.options[x.answer],successCount:0,lastCorrect:false,date:new Date().toLocaleString('zh-TW')};if(i>=0)w[i]={...w[i],...r};else w.push(r);save('social_exam2_wrongbook',w)}function recordScore(r){let h=read('social_exam2_scoreHistory',[]);h.unshift(r);save('social_exam2_scoreHistory',h)}function pct(c,t){return t?Math.round(c/t*100):0}function render(){let s=Object.values(read('social_exam2_questionStats',{})),w=read('social_exam2_wrongbook',[]),h=read('social_exam2_scoreHistory',[]),a=s.reduce((n,x)=>n+x.attempts,0),c=s.reduce((n,x)=>n+x.correct,0);$('overview').innerHTML=`<div class="card"><h3>累計作答</h3><b>${a}題次</b></div><div class="card"><h3>整體正確率</h3><b>${pct(c,a)}%</b></div><div class="card"><h3>待重做錯題</h3><b>${w.length}題</b></div><div class="card"><h3>成績紀錄</h3><b>${h.length}次</b></div>`;$('subjects').innerHTML=['地理','歷史','公民'].map(n=>{let x=s.filter(y=>y.subject===n),t=x.reduce((q,y)=>q+y.attempts,0),z=x.reduce((q,y)=>q+y.correct,0),p=pct(z,t);return `<p><b>${n}</b>：${z}/${t}（${p}%）</p><div class="bar"><div class="fill" style="width:${p}%"></div></div>`}).join('');$('weak').innerHTML=s.filter(x=>x.attempts&&pct(x.correct,x.attempts)<70).sort((x,y)=>pct(x.correct,x.attempts)-pct(y.correct,y.attempts)).slice(0,15).map(x=>`<div class="panel wrong"><span class="tag">${x.subject}</span><span class="core">${x.core}</span><p>${x.question}</p><b>正確率 ${pct(x.correct,x.attempts)}%（${x.correct}/${x.attempts}）</b></div>`).join('')||'<div class="key">目前沒有低於70%的核心考點。</div>'}$('reset').onclick=()=>{if(confirm('確定清除第二次段考分析資料？')){localStorage.removeItem('social_exam2_questionStats');render()}};render();</script></body></html>
